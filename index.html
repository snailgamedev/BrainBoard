<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1E3A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BrainBoard">
<title>🧠 BrainBoard · sharpen the mind · feed the spirit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cobalt:#1E3A8A;
  --cobalt-light:#3B5BD9;
  --purple:#7C3AED;
  --purple-deep:#5B21B6;
  --gold:#F59E0B;
  --gold-bright:#FBBF24;
  --cream:#FFF8E7;
  --white-holy:#FFFFFF;
  --ink:#0F172A;
  --parchment:#F5E6C8;
  --neural:#22D3EE;
  --crystal:#A855F7;
  --slate:#475569;
  --manna:#FCD34D;
  --good:#10B981;
  --bad:#EF4444;
  --warn:#F59E0B;
  --shadow:0 10px 30px rgba(15,23,42,.45);
  --glow-gold:0 0 24px rgba(245,158,11,.55);
  --glow-holy:0 0 36px rgba(255,255,255,.55);
  --r-sm:8px; --r-md:14px; --r-lg:22px; --r-xl:32px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;min-height:100vh;
  font-family:'Inter',system-ui,sans-serif;
  color:var(--cream);
  background:radial-gradient(ellipse at top,var(--cobalt-light) 0%,var(--cobalt) 40%,#0a1633 100%);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  min-height:100dvh;
}
h1,h2,h3{font-family:'Cinzel',serif;letter-spacing:.02em}
button{
  font-family:'Inter',sans-serif;
  cursor:pointer;border:none;
  -webkit-appearance:none;appearance:none;
}

/* ==================== SCREEN SYSTEM ==================== */
.screen{
  position:fixed;
  top:0;right:0;bottom:0;left:0;
  display:none;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  opacity:1;
  z-index:1;
}
.screen.active{display:flex !important;opacity:1 !important}
.screen.fade-in{animation:screenIn .35s ease forwards}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ==================== SPLASH ==================== */
#splash{
  background:
    radial-gradient(circle at 30% 20%,rgba(124,58,237,.4) 0%,transparent 60%),
    radial-gradient(circle at 70% 80%,rgba(245,158,11,.3) 0%,transparent 50%),
    linear-gradient(180deg,var(--cobalt) 0%,#0a1633 100%);
  align-items:center;justify-content:center;
  text-align:center;
}
.splash-emoji{
  font-size:96px;
  filter:drop-shadow(0 0 24px rgba(255,255,255,.4));
  animation:floatBob 3s ease-in-out infinite;
  margin-bottom:8px;
}
@keyframes floatBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.splash-title{
  font-family:'Cinzel',serif;
  font-size:clamp(40px,9vw,72px);
  font-weight:900;
  color:var(--gold-bright);
  -webkit-text-stroke:1px var(--white-holy);
  text-shadow:
    0 0 24px rgba(245,158,11,.65),
    0 4px 18px rgba(15,23,42,.8),
    0 0 60px rgba(255,248,231,.2);
  letter-spacing:.06em;
  margin-bottom:14px;
  animation:titlePulse 4s ease-in-out infinite;
}
@keyframes titlePulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}
.splash-tagline{
  font-style:italic;font-size:clamp(14px,3.5vw,18px);
  color:var(--cream);opacity:.85;
  margin-bottom:48px;letter-spacing:.05em;
}
.splash-cta{
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-bright) 100%);
  color:var(--ink);font-weight:800;
  padding:18px 44px;border-radius:99px;
  font-size:18px;letter-spacing:.05em;
  box-shadow:var(--glow-gold),0 8px 24px rgba(0,0,0,.35);
  animation:ctaPulse 2s ease-in-out infinite;
}
@keyframes ctaPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.splash-foot{
  position:absolute;bottom:24px;
  font-size:11px;opacity:.6;letter-spacing:.1em;
}

/* ==================== ONBOARDING ==================== */
#onboard{
  background:linear-gradient(180deg,var(--cobalt) 0%,var(--purple-deep) 100%);
  align-items:center;
  padding:24px 16px;
  overflow-y:auto;
}
.onboard-card{
  width:100%;max-width:440px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:var(--r-xl);
  padding:24px 18px;
  backdrop-filter:blur(12px);
  text-align:center;
  margin:auto;
}
.onboard-card h2{
  font-size:22px;color:var(--gold-bright);margin-bottom:8px;
}
.onboard-card p{font-size:14px;opacity:.85;margin-bottom:22px}
.mood-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;
}
.mood-btn{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  border-radius:var(--r-md);
  padding:18px 12px;
  color:var(--cream);
  font-size:15px;font-weight:600;
  transition:all .2s;
}
.mood-btn:active{transform:scale(.96)}
.mood-btn .em{display:block;font-size:32px;margin-bottom:6px}
.mood-btn.sel{
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-bright) 100%);
  color:var(--ink);
  box-shadow:var(--glow-gold);
}
.preset-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;
}
.preset-btn{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  border-radius:var(--r-md);
  padding:16px 4px;color:var(--cream);
  font-size:11px;font-weight:600;
}
.preset-btn .em{display:block;font-size:32px;margin-bottom:4px}
.preset-btn.sel{
  background:linear-gradient(135deg,var(--purple) 0%,var(--crystal) 100%);
  box-shadow:0 0 18px rgba(168,85,247,.5);
}
.name-input{
  width:100%;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  border-radius:var(--r-md);
  padding:14px;color:var(--cream);
  font-size:16px;font-family:inherit;
  margin-bottom:16px;text-align:center;
}
.name-input:focus{
  outline:none;
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(245,158,11,.2);
}
.btn-primary{
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-bright) 100%);
  color:var(--ink);font-weight:800;
  padding:14px 28px;border-radius:99px;
  font-size:15px;letter-spacing:.05em;
  width:100%;
  box-shadow:var(--glow-gold);
}
.btn-primary:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn-secondary{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  color:var(--cream);
  padding:12px 20px;border-radius:99px;
  font-size:14px;font-weight:600;
}

/* ==================== LOBBY ==================== */
#lobby{
  background:
    radial-gradient(circle at 50% 30%,rgba(124,58,237,.25) 0%,transparent 60%),
    linear-gradient(180deg,var(--cobalt) 0%,#0a1633 100%);
  overflow-y:auto;
}
.hud{
  position:sticky;top:0;z-index:50;
  background:rgba(10,22,51,.85);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:10px 14px;
  display:flex;flex-direction:column;gap:6px;
}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wallet{
  display:flex;gap:8px;flex-wrap:wrap;
  font-size:12px;font-weight:700;
}
.wallet-chip{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  padding:5px 9px;border-radius:99px;
  display:flex;align-items:center;gap:4px;
  font-variant-numeric:tabular-nums;
}
.profile-tag{
  display:flex;align-items:center;gap:6px;
  background:rgba(245,158,11,.15);
  padding:4px 10px;border-radius:99px;
  border:1px solid rgba(245,158,11,.3);
  font-size:12px;font-weight:700;
}
.icon-btn{
  width:36px;height:36px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:50%;
  font-size:16px;
  display:grid;place-items:center;
  color:var(--cream);
}
.lobby-content{
  flex:1;padding:16px;
  display:flex;flex-direction:column;gap:14px;
}
.lobby-banner{
  background:linear-gradient(135deg,rgba(124,58,237,.3) 0%,rgba(245,158,11,.2) 100%);
  border:1px solid rgba(245,158,11,.3);
  border-radius:var(--r-lg);
  padding:14px 16px;
  text-align:center;
  font-size:13px;
}
.lobby-banner b{color:var(--gold-bright)}
.lobby-title{
  text-align:center;
  font-family:'Cinzel',serif;
  font-size:22px;color:var(--gold-bright);
  letter-spacing:.06em;
  margin:8px 0 4px;
}
.rooms-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.room-door{
  position:relative;overflow:hidden;
  border-radius:var(--r-lg);
  padding:18px 14px;
  min-height:120px;
  display:flex;flex-direction:column;justify-content:space-between;
  border:1px solid rgba(255,255,255,.14);
  cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  text-align:left;color:var(--cream);
}
.room-door:active{transform:scale(.97)}
.room-door .em{font-size:36px;margin-bottom:6px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.room-door .name{font-family:'Cinzel',serif;font-size:16px;font-weight:700;letter-spacing:.04em}
.room-door .sub{font-size:11px;opacity:.75;margin-top:2px}
.room-word{background:linear-gradient(135deg,#8B6914 0%,#5A4308 100%)}
.room-brain{background:linear-gradient(135deg,#1E40AF 0%,#172554 100%)}
.room-mind{background:linear-gradient(135deg,#7C3AED 0%,#3B0764 100%)}
.room-num{background:linear-gradient(135deg,#0E7490 0%,#0C4A6E 100%)}
.room-script{
  background:linear-gradient(135deg,#B45309 0%,#7C2D12 50%,#4C1D95 100%);
  box-shadow:inset 0 0 24px rgba(255,248,231,.15);
}
.room-logic{background:linear-gradient(135deg,#0E7490 0%,#581C87 100%)}
.room-speed{background:linear-gradient(135deg,#DC2626 0%,#7C2D12 100%)}
.room-daily{background:linear-gradient(135deg,#10B981 0%,#064E3B 100%)}
.lobby-foot{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin-top:8px;
}
.foot-btn{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:var(--r-md);
  padding:14px 6px;
  color:var(--cream);
  font-size:11px;font-weight:600;
  text-align:center;
}
.foot-btn .em{display:block;font-size:22px;margin-bottom:2px}

/* ==================== ROOM SCREEN ==================== */
.room-screen{
  background:linear-gradient(180deg,var(--cobalt) 0%,#0a1633 100%);
  overflow-y:auto;
}
.room-header{
  position:sticky;top:0;z-index:30;
  background:rgba(10,22,51,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:12px 14px;
  display:flex;align-items:center;gap:10px;
}
.back-btn{
  width:36px;height:36px;
  background:rgba(255,255,255,.08);
  border-radius:50%;
  font-size:18px;
  display:grid;place-items:center;
  color:var(--cream);border:none;
}
.room-title-block{flex:1}
.room-title-block h2{font-size:18px;color:var(--gold-bright);font-weight:700}
.room-title-block .sub{font-size:11px;opacity:.7}
.room-body{
  flex:1;padding:14px;
  display:flex;flex-direction:column;gap:12px;
}
.game-card{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:var(--r-lg);
  padding:16px;
  display:flex;align-items:center;gap:14px;
  cursor:pointer;
  transition:all .2s;
}
.game-card:active{transform:scale(.98)}
.game-card .em{font-size:42px;flex-shrink:0}
.game-card .info{flex:1}
.game-card .info h3{font-size:15px;color:var(--cream);font-weight:700;margin-bottom:2px}
.game-card .info .sub{font-size:11px;opacity:.7;line-height:1.4}
.game-card .stat{
  font-size:11px;font-weight:700;
  background:rgba(245,158,11,.18);
  color:var(--gold-bright);
  padding:4px 8px;border-radius:99px;
}

/* ==================== GAME UI ==================== */
.game-screen{
  background:linear-gradient(180deg,var(--cobalt) 0%,#0a1633 100%);
  overflow:hidden;
}
.game-header{
  padding:10px 14px;
  background:rgba(10,22,51,.95);
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}
.game-stats{flex:1;font-size:11px;opacity:.85}
.game-stats b{color:var(--gold-bright)}
.game-area{
  flex:1;overflow-y:auto;
  padding:18px 14px;
  display:flex;flex-direction:column;
  align-items:center;gap:14px;
}

/* WORDLE */
.word-grid{
  display:grid;
  grid-template-rows:repeat(6,52px);
  gap:6px;margin:8px 0;
}
.word-row{
  display:grid;
  grid-template-columns:repeat(5,52px);
  gap:6px;
}
.word-cell{
  width:52px;height:52px;
  border:2px solid rgba(255,255,255,.18);
  border-radius:var(--r-sm);
  display:grid;place-items:center;
  font-family:'Cinzel',serif;
  font-size:24px;font-weight:700;
  text-transform:uppercase;
  background:rgba(255,255,255,.04);
  transition:all .3s;
}
.word-cell.filled{border-color:var(--cream)}
.word-cell.green{background:var(--good);border-color:var(--good);color:#fff}
.word-cell.yellow{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.word-cell.gray{background:var(--slate);border-color:var(--slate);color:#fff}
.word-keyboard{
  width:100%;max-width:420px;
  display:flex;flex-direction:column;gap:6px;
  margin-top:8px;
}
.word-keyrow{display:flex;justify-content:center;gap:4px}
.word-key{
  flex:1;min-width:24px;max-width:36px;
  height:46px;
  background:rgba(255,255,255,.12);
  border-radius:var(--r-sm);
  font-weight:700;font-size:13px;
  color:var(--cream);
  display:grid;place-items:center;
}
.word-key.wide{max-width:60px;font-size:11px}
.word-key.green{background:var(--good)}
.word-key.yellow{background:var(--gold);color:var(--ink)}
.word-key.gray{background:var(--slate);opacity:.5}

/* MEMORY MATCH */
.mem-grid{
  display:grid;gap:8px;
  width:100%;max-width:340px;
}
.mem-card{
  aspect-ratio:1;
  background:linear-gradient(135deg,var(--purple) 0%,var(--cobalt) 100%);
  border:2px solid rgba(255,255,255,.15);
  border-radius:var(--r-md);
  display:grid;place-items:center;
  font-size:28px;
  cursor:pointer;
  transition:transform .25s;
  transform-style:preserve-3d;
}
.mem-card.flipped{
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-bright) 100%);
  transform:rotateY(180deg);
}
.mem-card.flipped .face{transform:rotateY(180deg)}
.mem-card.matched{
  background:linear-gradient(135deg,var(--good) 0%,#0E9F6E 100%);
  cursor:default;animation:pop .35s;
}
@keyframes pop{50%{transform:scale(1.12)}}
.mem-card .face{display:none}
.mem-card.flipped .face,.mem-card.matched .face{display:block}

/* STROOP */
.stroop-area{
  display:flex;flex-direction:column;align-items:center;
  width:100%;gap:18px;
}
.stroop-word{
  font-family:'Cinzel',serif;
  font-size:64px;font-weight:900;
  margin:24px 0;
  text-shadow:0 4px 12px rgba(0,0,0,.5);
  animation:stroopPop .3s;
}
@keyframes stroopPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.stroop-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  width:100%;max-width:320px;
}
.stroop-btn{
  padding:18px;border-radius:var(--r-md);
  font-weight:800;font-size:15px;
  color:#fff;
  border:2px solid rgba(255,255,255,.2);
  text-transform:uppercase;
  letter-spacing:.05em;
}
.stroop-btn:active{transform:scale(.96)}

/* MATH SPRINT */
.math-q{
  font-family:'Cinzel',serif;
  font-size:48px;font-weight:700;
  margin:24px 0 12px;
  text-align:center;
  color:var(--gold-bright);
}
.math-input{
  width:100%;max-width:200px;
  background:rgba(255,255,255,.1);
  border:2px solid var(--gold);
  border-radius:var(--r-md);
  padding:14px;
  color:var(--cream);
  font-size:24px;font-weight:700;
  text-align:center;font-family:inherit;
}
.math-pad{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;width:100%;max-width:280px;margin-top:12px;
}
.math-key{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r-md);
  padding:18px;
  font-size:22px;font-weight:700;
  color:var(--cream);
}
.math-key.go{background:var(--good);grid-column:span 2}
.math-key.del{background:var(--bad)}

/* VERSE FILL-IN */
.verse-card{
  width:100%;max-width:480px;
  background:linear-gradient(135deg,rgba(180,83,9,.25) 0%,rgba(76,29,149,.25) 100%);
  border:1px solid rgba(245,158,11,.3);
  border-radius:var(--r-lg);
  padding:24px 18px;
  text-align:center;
  font-size:18px;line-height:1.7;
  color:var(--cream);
  font-family:'Cinzel',serif;
  font-weight:500;
  position:relative;
}
.verse-blank{
  display:inline-block;
  min-width:80px;
  border-bottom:2px solid var(--gold);
  margin:0 4px;padding:0 6px;
  color:var(--gold-bright);font-weight:700;
}
.verse-blank.filled{color:var(--good)}
.verse-ref{
  display:block;margin-top:12px;
  font-size:13px;color:var(--gold);font-style:italic;
}
.verse-options{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;width:100%;max-width:420px;
}
.verse-opt{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r-md);
  padding:14px;
  color:var(--cream);font-weight:600;
  font-family:'Cinzel',serif;
}
.verse-opt:active{transform:scale(.96)}

/* DAILY COURT */
.daily-card{
  width:100%;max-width:420px;
  background:linear-gradient(135deg,rgba(16,185,129,.3) 0%,rgba(245,158,11,.2) 100%);
  border:1px solid rgba(16,185,129,.4);
  border-radius:var(--r-lg);
  padding:22px 18px;text-align:center;
}
.daily-card .em{font-size:64px;margin-bottom:8px}
.daily-card h3{font-family:'Cinzel',serif;font-size:22px;color:var(--gold-bright);margin-bottom:6px}
.daily-card p{font-size:13px;opacity:.85;margin-bottom:18px}

/* ==================== TOAST ==================== */
.toast-stack{
  position:fixed;top:80px;left:50%;
  transform:translateX(-50%);
  z-index:200;
  display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
  width:90%;max-width:340px;
}
.toast{
  background:rgba(10,22,51,.95);
  border:1px solid rgba(245,158,11,.4);
  backdrop-filter:blur(12px);
  border-radius:var(--r-md);
  padding:12px 16px;
  font-size:13px;font-weight:600;
  color:var(--cream);
  box-shadow:var(--shadow);
  animation:toastIn .35s,toastOut .35s 2.6s forwards;
}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-12px)}}
.toast .ach{color:var(--gold-bright);font-weight:800}

/* ==================== MODAL ==================== */
.modal-bg{
  position:fixed;inset:0;
  background:rgba(10,22,51,.85);
  backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.modal-bg.active{display:flex;animation:fadeIn .3s}

/* ==================== v0.8 SIDE-SAINT (NO-OVERLAP RULE) ==================== */
/* Avatar preview floats to the SIDE — NEVER covers scrolling content */
.av-sticky-preview{
  position:sticky;
  top:12px;
  float:right;
  width:170px;
  margin:0 0 12px 12px;
  background:rgba(10,22,51,.92);
  border:1.5px solid rgba(245,158,11,.4);

  z-index:50;
  text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.4),0 0 24px rgba(245,158,11,.15);

  -webkit-backdrop-filter:blur(10px);
}
.av-sticky-preview .av-frame-wrap,
.av-sticky-preview .av-scene-wrap{
  margin:4px auto 0;
}
.av-sticky-preview .av-scene-wrap{
  width:130px;height:130px;
}
.av-sticky-preview .av-scene-wrap span{font-size:60px !important}

.av-sticky-preview .title-chip{font-size:9px;padding:2px 8px;margin:4px auto}
.av-sticky-preview .bio-quote{font-size:10px;margin:4px 0;padding:0 4px}

    right:8px;
    top:auto;
    bottom:14px;

  .av-sticky-preview .av-tools{display:none}
  .av-sticky-preview .title-chip{display:none}

  const aura = getAvatarEm('aura', av.aura);
  const hat = getAvatarEm('hat', av.hat);
  const face = getAvatarEm('face', av.face);
  const ch = getAvatarEm('character', av.character) || '🧘';
  const outfit = getAvatarEm('outfit', av.outfit);
  const pet = getAvatarEm('pet', av.pet);
  const filterParts = [];
  if(hue) filterParts.push(`hue-rotate(${hue}deg)`);
  if(sat!==100) filterParts.push(`saturate(${sat}%)`);
  if(bri!==100) filterParts.push(`brightness(${bri}%)`);
  if(glow>0) filterParts.push(`drop-shadow(0 0 ${Math.round(glow*.3)}px rgba(255,215,100,.85))`);
  const filter = filterParts.length ? `filter:${filterParts.join(' ')}` : '';
  const animDef = ANIMS.find(a=>a.id===animId);
  const animCss = animDef ? animDef.css : '';
  const styles = [filter, animCss].filter(Boolean).join(';');
  return `<span class="avatar-stack ${sizeClass}" style="${styles}">
    ${aura?`<span class="av-aura">${aura}</span>`:''}
    ${hat?`<span class="av-hat">${hat}</span>`:''}
    <span class="av-main">${ch}${face?`<span class="av-face">${face}</span>`:''}</span>
    ${outfit?`<span class="av-outfit">${outfit}</span>`:''}
    ${pet?`<span class="av-pet">${pet}</span>`:''}
  </span>`;
}

function renderAvatarBig(av, opts){
  // Big wrapper with scene + frame around the stack
  if(!av) av = State.data?.avatar || DEFAULT_SAVE.avatar;
  const sceneId = opts?.scene ?? (State.data?.scene||'none');
  const frameId = opts?.frame ?? (State.data?.frame||'none');
  const sceneDef = SCENES.find(s=>s.id===sceneId) || SCENES[0];
  const frameDef = FRAMES.find(f=>f.id===frameId) || FRAMES[0];
  const stack = renderAvatarStack(av, opts?.hue, opts?.size, opts);

    <div class="av-scene-wrap"><div class="av-scene-bg" style="${sceneDef.css||''}"></div>
    <span style="position:relative;z-index:1;font-size:96px">${stack}</span>
    </div>
  </div>`;
}

const DNA = {
  bumpFromRoom(room){
    const d = State.data;
    if(!d.brainDNA) d.brainDNA = {memory:0,speed:0,pattern:0,logic:0,word:0,faith:0};
    const map = {word:'word', brain:'memory', mind:'pattern', num:'logic', script:'faith', logic:'logic', speed:'speed', daily:'speed'};
    const axis = map[room]; if(axis) d.brainDNA[axis]++;
  },
  axes(){
    const d = State.data.brainDNA||{};
    return [
      {k:'memory',label:'Memory',v:d.memory||0},
      {k:'speed',label:'Speed',v:d.speed||0},
      {k:'pattern',label:'Pattern',v:d.pattern||0},
      {k:'logic',label:'Logic',v:d.logic||0},
      {k:'word',label:'Word',v:d.word||0},
      {k:'faith',label:'Faith',v:d.faith||0},
    ];
  },
  renderRadar(size=240){
    const axes = DNA.axes();
    const max = Math.max(5, ...axes.map(a=>a.v));
    const cx=size/2, cy=size/2, r=size/2-30;
    const n=axes.length;
    const angle=i=>(-Math.PI/2)+(i*2*Math.PI/n);
    const point=(i,val)=>({x:cx+Math.cos(angle(i))*r*(val/max), y:cy+Math.sin(angle(i))*r*(val/max)});
    let svg = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">`;
    // grid rings
    for(let g=1;g<=4;g++){
      const ringR = r*(g/4);
      let pts='';
      for(let i=0;i<n;i++){
        const x = cx+Math.cos(angle(i))*ringR;
        const y = cy+Math.sin(angle(i))*ringR;
        pts += `${x},${y} `;
      }
      svg += `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1"/>`;
    }
    // axis lines
    for(let i=0;i<n;i++){
      const e = point(i,max);
      svg += `<line x1="${cx}" y1="${cy}" x2="${e.x}" y2="${e.y}" stroke="rgba(255,255,255,.08)"/>`;
    }
    // data polygon
    let dataPts='';
    axes.forEach((a,i)=>{
      const p = point(i,a.v);
      dataPts += `${p.x},${p.y} `;
    });
    svg += `<polygon points="${dataPts}" fill="rgba(245,158,11,.3)" stroke="#FBBF24" stroke-width="2"/>`;
    // dots
    axes.forEach((a,i)=>{
      const p = point(i,a.v);
      svg += `<circle cx="${p.x}" cy="${p.y}" r="3" fill="#FBBF24"/>`;
    });
    svg += `</svg>`;
    let labels='';
    axes.forEach((a,i)=>{
      const lab = point(i,max*1.18);
      labels += `<div class="dna-label" style="left:${lab.x-22}px;top:${lab.y-8}px;width:44px;text-align:center">${a.label}<br><span style="opacity:.7;font-weight:600">${a.v}</span></div>`;
    });
    return `<div class="dna-radar">${svg}${labels}</div>`;
  }
};

// 🔊 SFX (procedural via WebAudio)
// ====================================================================
const SFX = (()=>{
  let ctx=null;
  function ac(){ if(!ctx&&State.data?.settings?.sfx) ctx=new(window.AudioContext||window.webkitAudioContext)(); return ctx; }
  function tone(freq,dur=.15,type='sine',gain=.15){
    const c = ac(); if(!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(gain,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
  }
  return {
    tap(){ tone(660,.06,'square',.08); },
    correct(){ tone(523,.1); setTimeout(()=>tone(784,.15),60); },
    wrong(){ tone(220,.18,'sawtooth',.1); },
    win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18),i*100)); },
    chime(){ [349,440,523].forEach((f,i)=>setTimeout(()=>tone(f,.25,'sine',.12),i*120)); },
    holy(){ [392,493,587,784,987].forEach((f,i)=>setTimeout(()=>tone(f,.4,'sine',.1),i*120)); },
  };
})();

    setText('p-iq', fmt(State.data?.iq||1000));
    const streakEl = document.getElementById('p-streak');
    const streak = State.data?.streak||0;
    if(streakEl){
      streakEl.textContent = streak;
      streakEl.parentElement.className = streak>=3 ? 'flame-streak dim' : 'dim';
    }
    // v0.3 — render avatar stack instead of single emoji
    const pem = document.getElementById('p-em');
    if(pem) pem.innerHTML = renderAvatarStack();
    setText('p-name', State.data?.name||'Saint');
  }
};
function setText(id,v){ const el=document.getElementById(id); if(el) el.textContent=v; }
function fmt(n){ if(n<1000) return n; if(n<1e6) return (n/1000).toFixed(1)+'k'; return (n/1e6).toFixed(1)+'M'; }
function el(t,c,h){ const e=document.createElement(t); if(c)e.className=c; if(h!==undefined)e.innerHTML=h; return e; }
function confetti(){
  const colors=['#F59E0B','#FBBF24','#7C3AED','#3B82F6','#10B981','#EF4444','#FFF8E7'];
  for(let i=0;i<36;i++){
    const p = document.createElement('div');
    p.className='confetti-piece';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.left=(50+Math.random()*10-5)+'%';
    p.style.top='40%';
    p.style.setProperty('--dx', ((Math.random()-.5)*window.innerWidth*1.2)+'px');
    p.style.setProperty('--dy', ((Math.random()-.2)*window.innerHeight*.9)+'px');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1600);
  }
}

function recordResult(roomId, gameId, won, rewards={}){
  const d = State.data;
  const key = `${roomId}:${gameId}`;
  if(!d.perGame[key]) d.perGame[key] = {wins:0,plays:0,best:0,lastWin:0};
  d.perGame[key].plays++;
  d.totals.games++;
  const gameDef = ROOMS[roomId]?.games.find(g=>g.id===gameId);
  const gName = gameDef ? gameDef.name : gameId;
  if(won){
    if(State._dailyMultiplier){
      Object.keys(rewards).forEach(k=>rewards[k]=Math.round(rewards[k]*State._dailyMultiplier));
      State._dailyMultiplier = null;
    }
    d.perGame[key].wins++;
    d.perGame[key].lastWin = Date.now();
    d.totals.wins++;
    d.iq = Math.min(2400, d.iq + 8);
    Wallet.add(rewards);
    DNA.bumpFromRoom(roomId);
    Activity.log('win','🏆',`won ${gName}`);
    BP.addXp(2);
  }else{
    d.totals.losses++;
    d.iq = Math.max(800, d.iq - 4);
    Activity.log('loss','💪',`played ${gName}`);
    BP.addXp(1);
  }
  Save.write();
  Ach.check();
  UI.updateWallet();
}

    this.target = WORDS[Math.floor(Math.random()*WORDS.length)];
    this.row = 0; this.col = 0;
    this.guesses = Array(6).fill(null).map(()=>Array(5).fill(''));
    this.cellStates = Array(6).fill(null).map(()=>Array(5).fill(''));
    this.keyStates = {};
    this.done = false;
    this.startTime = Date.now();
    this.render();
    UI.show('game');
  },
  render(){
    const stats = State.data.perGame['word:wordle']||{wins:0};
    setText('g-stats', `<b>5-Letter</b> · best wins: <b>${stats.wins}</b> · target hidden 👀`.replace(/<b>/g,'<b>'));
    document.getElementById('g-stats').innerHTML = `<b>📖 5-Letter</b> · row ${this.row+1}/6 · wins: <b>${stats.wins||0}</b>`;
    const area = document.getElementById('g-area');
    area.innerHTML = '';
    const grid = el('div','word-grid');
    for(let r=0;r<6;r++){
      const row = el('div','word-row');
      for(let c=0;c<5;c++){
        const ch = this.guesses[r][c];
        const st = this.cellStates[r][c];
        const cell = el('div',`word-cell ${ch?'filled':''} ${st}`, ch);
        row.appendChild(cell);
      }
      grid.appendChild(row);
    }
    area.appendChild(grid);
    // keyboard
    const kb = el('div','word-keyboard');
    const rows = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
    rows.forEach((rk,i)=>{
      const r = el('div','word-keyrow');
      if(i===2){
        const enter = el('button','word-key wide','ENTER');
        enter.onclick = ()=>this.submit();
        r.appendChild(enter);
      }
      [...rk].forEach(k=>{
        const b = el('button',`word-key ${this.keyStates[k]||''}`, k);
        b.onclick = ()=>this.input(k);
        r.appendChild(b);
      });
      if(i===2){
        const del = el('button','word-key wide','⌫');
        del.onclick = ()=>this.del();
        r.appendChild(del);
      }
      kb.appendChild(r);
    });
    area.appendChild(kb);
  },
  input(k){
    if(this.done || this.col>=5) return;
    this.guesses[this.row][this.col] = k;
    this.col++;
    haptic(5);
    SFX.tap();
    this.render();
  },
  del(){
    if(this.done || this.col===0) return;
    this.col--;
    this.guesses[this.row][this.col]='';
    haptic(5);
    this.render();
  },
  submit(){
    if(this.done || this.col<5) return;
    const guess = this.guesses[this.row].join('');
    // mark cells
    const target = this.target.split('');
    const states = Array(5).fill('gray');
    const used = Array(5).fill(false);
    for(let i=0;i<5;i++){
      if(guess[i]===target[i]){ states[i]='green'; used[i]=true; }
    }
    for(let i=0;i<5;i++){
      if(states[i]==='green') continue;
      for(let j=0;j<5;j++){
        if(!used[j] && guess[i]===target[j]){
          states[i]='yellow'; used[j]=true; break;
        }
      }
    }
    this.cellStates[this.row] = states;
    // update key states (best-state-wins)
    for(let i=0;i<5;i++){
      const k = guess[i], s = states[i];
      const cur = this.keyStates[k];
      if(!cur || (cur==='gray'&&s!=='gray') || (cur==='yellow'&&s==='green')) this.keyStates[k]=s;
    }
    if(guess===this.target){
      this.done=true;
      const time = ((Date.now()-this.startTime)/1000).toFixed(1);
      const baseCoins = 60 + (5-this.row)*15;
      const rewards = {coin:baseCoins, brain:5, faith:1};
      recordResult('word','wordle',true,rewards);
      this.render();
      setTimeout(()=>{
        Modal.win({rewards, title:'WELL DONE!', emoji:'🎉',
          retry:()=>WordleGame.start(),
          lobby:()=>App.toLobby()});
      },500);
    }else if(this.row>=5){
      this.done=true;
      recordResult('word','wordle',false);
      this.render();
      setTimeout(()=>{
        Modal.lose({title:'so close!',msg:'better luck next time, saint',answer:this.target,
          retry:()=>WordleGame.start(),
          lobby:()=>App.toLobby()});
      },500);
    }else{
      this.row++; this.col=0;
      SFX.tap();
      haptic(15);
      this.render();
    }
  },
  cleanup(){}
};

const MemoryGame = {
  start(){
    State.gameInst = this;
    const symbols = ['🦁','🐑','🕊️','🌟','📖','✝️','🔥','🌿'];
    this.cards = [...symbols, ...symbols].sort(()=>Math.random()-.5);
    this.flipped = []; this.matched = new Set(); this.moves = 0;
    this.startTime = Date.now();
    this.render();
    UI.show('game');
  },
  render(){
    document.getElementById('g-stats').innerHTML = `<b>🧠 Memory Match</b> · moves: <b>${this.moves}</b> · matched: <b>${this.matched.size/2}/8</b>`;
    const area = document.getElementById('g-area');
    area.innerHTML = '';
    const grid = el('div','mem-grid');
    grid.style.gridTemplateColumns='repeat(4,1fr)';
    this.cards.forEach((sym,i)=>{
      const c = el('div',`mem-card ${this.flipped.includes(i)?'flipped':''} ${this.matched.has(i)?'matched':''}`,
        `<span class="face">${sym}</span>`);
      c.onclick = ()=>this.flip(i);
      grid.appendChild(c);
    });
    area.appendChild(grid);
  },
  flip(i){
    if(this.flipped.includes(i)||this.matched.has(i)||this.flipped.length>=2) return;
    this.flipped.push(i);
    SFX.tap();
    haptic(5);
    this.render();
    if(this.flipped.length===2){
      this.moves++;
      const [a,b] = this.flipped;
      if(this.cards[a]===this.cards[b]){
        setTimeout(()=>{
          this.matched.add(a); this.matched.add(b);
          this.flipped=[];
          SFX.correct();
          haptic(15);
          this.render();
          if(this.matched.size===this.cards.length){
            const baseCoins = Math.max(40, 200 - this.moves*8);
            const rewards = {coin:baseCoins, brain:4};
            recordResult('brain','memory',true,rewards);
            setTimeout(()=>Modal.win({rewards, title:`Matched in ${this.moves} moves!`, emoji:'🎉',
              retry:()=>MemoryGame.start(), lobby:()=>App.toLobby()}),500);
          }
        },400);
      }else{
        setTimeout(()=>{
          this.flipped=[];
          SFX.wrong();
          this.render();
        },800);
      }
    }
  },
  cleanup(){}
};

// 🎮 GAME 4 · MATH SPRINT
// ====================================================================
const MathGame = {
  start(){
    State.gameInst = this;
    this.score = 0; this.timeLeft = 30; this.input='';
    this.next();
    this.timer = setInterval(()=>{
      this.timeLeft--;
      if(this.timeLeft<=0){ this.end(); return; }
      this.render();
    },1000);
    UI.show('game');
  },
  next(){
    const ops = ['+','-','×'];
    const op = ops[Math.floor(Math.random()*ops.length)];
    let a,b,answer;
    if(op==='+'){a=Math.floor(Math.random()*40)+10;b=Math.floor(Math.random()*40)+10;answer=a+b;}
    else if(op==='-'){a=Math.floor(Math.random()*60)+30;b=Math.floor(Math.random()*a);answer=a-b;}
    else{a=Math.floor(Math.random()*12)+2;b=Math.floor(Math.random()*12)+2;answer=a*b;}
    this.q = `${a} ${op} ${b}`;
    this.answer = answer;
    this.input='';
    this.render();
  },
  render(){
    document.getElementById('g-stats').innerHTML = `<b>🔢 Math Sprint</b> · score: <b>${this.score}</b> · ⏱ <b>${this.timeLeft}s</b>`;
    const area = document.getElementById('g-area');
    area.innerHTML = '';
    const wrap = el('div','stroop-area');
    wrap.appendChild(el('div','dim','solve as many as you can'));
    wrap.appendChild(el('div','math-q', this.q + ' = ?'));
    wrap.appendChild(el('div','math-input', this.input || '_'));
    const pad = el('div','math-pad');
    ['1','2','3','4','5','6','7','8','9'].forEach(n=>{
      const b = el('button','math-key', n);
      b.onclick = ()=>this.press(n);
      pad.appendChild(b);
    });
    const del = el('button','math-key del','⌫');
    del.onclick = ()=>this.delPress();
    pad.appendChild(del);
    const z = el('button','math-key', '0');
    z.onclick = ()=>this.press('0');
    pad.appendChild(z);
    const go = el('button','math-key go','GO');
    go.onclick = ()=>this.submit();
    pad.appendChild(go);
    wrap.appendChild(pad);
    area.appendChild(wrap);
  },

    if(this.input.length>=4) return;
    this.input += n;
    SFX.tap();
    haptic(4);
    this.render();
  },
  delPress(){
    this.input = this.input.slice(0,-1);
    haptic(4);
    this.render();
  },
  submit(){
    if(!this.input) return;
    if(parseInt(this.input)===this.answer){

      haptic(20);

    this.next();

      retry:()=>MathGame.start(), lobby:()=>App.toLobby()});

};

// 🎮 GAME 8 · SIMON SAYS (Brain Gym)

const SimonGame = {
  start(){
    State.gameInst=this;
    this.colors=['red','blue','green','yellow'];
    this.hexes=['#EF4444','#3B82F6','#10B981','#F59E0B'];
    this.sequence=[]; this.userIdx=0; this.showing=false; this.flashIdx=-1;
    this.addToSequence();
    UI.show('game');
  },
  addToSequence(){
    this.sequence.push(Math.floor(Math.random()*4));
    this.userIdx=0;
    this.render();
    setTimeout(()=>this.playSequence(),700);
  },
  playSequence(){
    this.showing=true;
    let i=0;
    const flash=()=>{
      if(i>=this.sequence.length){
        this.showing=false; this.flashIdx=-1; this.render(); return;
      }
      this.flashIdx=this.sequence[i];
      this.render();
      SFX.tap();
      setTimeout(()=>{
        this.flashIdx=-1; this.render();
        i++;
        setTimeout(flash, 280);
      }, 480);
    };
    flash();
  },
  tap(idx){
    if(this.showing) return;
    if(idx===this.sequence[this.userIdx]){
      SFX.correct(); haptic(5);
      this.flashIdx=idx; this.render();
      setTimeout(()=>{this.flashIdx=-1;this.render();},180);
      this.userIdx++;
      if(this.userIdx>=this.sequence.length){
        if(this.sequence.length>=10){this.win();return;}
        setTimeout(()=>this.addToSequence(), 600);
      }
    }else{
      SFX.wrong(); haptic(40);
      this.lose();
    }

  render(){
    document.getElementById('g-stats').innerHTML = `<b>🧠 Simon Says</b> · level: <b>${this.sequence.length}</b> · ${this.showing?'WATCH':'YOUR TURN'}`;
    const area = document.getElementById('g-area');

    const wrap = el('div','stroop-area');
    wrap.appendChild(el('div','dim',this.showing?'watch the sequence...':'tap in order'));
    const grid = el('div','stroop-grid');
    grid.style.maxWidth='280px';
    this.colors.forEach((c,i)=>{
      const b = el('button','stroop-btn', '');
      b.style.background=this.hexes[i];
      b.style.aspectRatio='1';
      b.style.opacity = (this.flashIdx===i)?'1':'.55';
      b.style.boxShadow = (this.flashIdx===i)?'0 0 30px rgba(255,255,255,.7)':'none';
      b.style.transform = (this.flashIdx===i)?'scale(1.05)':'scale(1)';
      b.onclick=()=>this.tap(i);
      grid.appendChild(b);
    });
    wrap.appendChild(grid);
    area.appendChild(wrap);
  },
  win(){
    const rewards = {coin:80+this.sequence.length*10, brain:5};
    recordResult('brain','simon',true,rewards);
    Modal.win({rewards, title:`Level ${this.sequence.length} · WOW!`, emoji:'🎼',
      retry:()=>SimonGame.start(), lobby:()=>App.toLobby()});
  },
  lose(){
    const reached = this.sequence.length;
    const won = reached>=5;
    const rewards = won ? {coin:20+reached*5, brain:2} : {coin:Math.max(5,reached*3)};
    recordResult('brain','simon',won,rewards);
    if(won) Modal.win({rewards, title:`Level ${reached}!`, emoji:'🎼',
      retry:()=>SimonGame.start(), lobby:()=>App.toLobby()});
    else Modal.lose({title:`Level ${reached}`,msg:'reach level 5 for the win!',
      retry:()=>SimonGame.start(), lobby:()=>App.toLobby()});
  },
  cleanup(){}
};

// 🎮 GAME 9 · REACTION TAP (Mind Games)
// ====================================================================
const ReactionGame = {
  start(){
    State.gameInst=this;
    this.round=0; this.times=[]; this.state='wait';
    this.next();
    UI.show('game');
  },
  next(){
    this.state='wait'; this.render();
    const wait = 1500+Math.random()*2500;
    this.timer = setTimeout(()=>{
      this.state='go';
      this.startTime=Date.now();
      SFX.tap();
      this.render();
    }, wait);
  },
  tap(){
    if(this.state==='wait'){
      clearTimeout(this.timer);
      this.state='early'; SFX.wrong(); haptic(30); this.render();
      setTimeout(()=>this.next(),1500);
      return;
    }
    if(this.state==='go'){
      const t=Date.now()-this.startTime;
      this.times.push(t);
      this.round++;
      SFX.correct(); haptic(10);
      if(this.round>=5){this.end();return;}
      setTimeout(()=>this.next(),700);
    }
  },
  render(){
    document.getElementById('g-stats').innerHTML = `<b>🎯 Reaction Tap</b> · round: <b>${Math.min(this.round+1,5)}/5</b> · last: <b>${this.times.length?this.times[this.times.length-1]+'ms':'—'}</b>`;
    const area = document.getElementById('g-area');
    area.innerHTML = '';
    const wrap = el('div','stroop-area');
    const colors={wait:'#7C3AED',go:'#10B981',early:'#EF4444'};
    const text={wait:'WAIT...',go:'TAP NOW!',early:'TOO EARLY'};
    const sub={wait:'wait for green',go:'tap as fast as you can',early:'reset...'};
    const big = el('button','',text[this.state]);
    big.style.cssText = `width:100%;max-width:380px;height:50vh;background:${colors[this.state]};border:none;border-radius:22px;color:white;font-size:42px;font-weight:900;font-family:'Cinzel',serif;letter-spacing:.05em;box-shadow:0 0 40px ${colors[this.state]}77`;
    big.onclick=()=>this.tap();
    wrap.appendChild(big);
    wrap.appendChild(el('div','dim',sub[this.state]));
    area.appendChild(wrap);
  },
  end(){

  next(){
    const patterns=[
      ()=>{const a=Math.floor(Math.random()*5)+1; const d=Math.floor(Math.random()*5)+1; return {seq:[a,a+d,a+2*d,a+3*d], next:a+4*d};},
      ()=>{const a=Math.floor(Math.random()*4)+1; return {seq:[a,a*2,a*4,a*8], next:a*16};},

      ()=>({seq:[1,1,2,3], next:5}),
      ()=>({seq:[2,3,5,8], next:13}),

      ()=>({seq:[3,6,12,24], next:48}),
      ()=>({seq:[1,3,6,10], next:15}),

// 🎮 GAME 12 · LIGHTS OUT (Logic Lab)
// ====================================================================
const LightsGame = {
  start(){
    State.gameInst=this;
    this.grid = Array(9).fill(false);
    const taps = 3 + Math.floor(Math.random()*3);
    const used = new Set();
    while(used.size<taps){
      const i = Math.floor(Math.random()*9);
      if(used.has(i)) continue;
      used.add(i);
      this._toggle(i);
    }
    this.moves = 0; this.done = false;
    this.startTime = Date.now();
    this.render();
    UI.show('game');
  },
  _toggle(i){
    const flip=(idx)=>{ if(idx>=0&&idx<9) this.grid[idx]=!this.grid[idx]; };
    flip(i);
    const r=Math.floor(i/3), c=i%3;
    if(c>0) flip(i-1);
    if(c<2) flip(i+1);
    if(r>0) flip(i-3);
    if(r<2) flip(i+3);
  },
  tap(i){
    if(this.done) return;
    SFX.tap(); haptic(8);
    this._toggle(i);
    this.moves++;
    if(this.grid.every(x=>!x)){
      this.done=true;
      this.render();
      const won = this.moves<=10;
      const rewards = won ? {coin:50+(11-this.moves)*6, brain:3} : {coin:30, brain:1};
      recordResult('logic','lights',true,rewards);
      setTimeout(()=>Modal.win({rewards, title:`Cleared in ${this.moves} moves!`, emoji:'💡',
        retry:()=>LightsGame.start(), lobby:()=>App.toLobby()}),400);
      return;
    }
    this.render();
  },
  render(){
    document.getElementById('g-stats').innerHTML = `<b>🧩 Lights Out</b> · moves: <b>${this.moves}</b> · turn ALL off!`;
    const area = document.getElementById('g-area');
    area.innerHTML = '';

const HuntGame = {
  start(){
    State.gameInst=this;
    this.score=0; this.timeLeft=45;

      this.timeLeft--;

    this.target = dup;

    this.render();

    document.getElementById('g-stats').innerHTML = `<b>🧩 Number Hunt</b> · score: <b>${this.score}</b> · ⏱ <b>${this.timeLeft}s</b>`;

  },
  next(){
    if(this.round>=5){this.end();return;}

    this.render();
    this.showTimer = setTimeout(()=>{
      this.phase = 'input';
      this.render();
    }, 1500);
  },

    SFX.tap();
    haptic(4);
    if(this.input.length===4){
      // submit
      if(this.input===this.code){ this.score++; SFX.correct(); haptic(15); }
      else{ SFX.wrong(); haptic(30); }
      setTimeout(()=>this.next(), 600);
    }
    this.render();
  },
  delPress(){
    if(this.phase!=='input') return;
    this.input = this.input.slice(0,-1);
    haptic(4);
    this.render();
  },
  render(){
    document.getElementById('g-stats').innerHTML = `<b>⚡ Code Sprint</b> · round <b>${this.round}/5</b> · score <b>${this.score}</b>`;
    const area = document.getElementById('g-area');
    area.innerHTML = '';
    const wrap = el('div','stroop-area');
    if(this.phase==='show'){
      wrap.appendChild(el('div','dim','memorize this code · 1.5s'));
      const big = el('div','math-q', this.code.split('').join(' '));
      big.style.color = 'var(--gold-bright)';
      big.style.fontSize='56px';
      wrap.appendChild(big);
    }else{
      wrap.appendChild(el('div','dim','type the code'));
      const inp = el('div','math-input', this.input + '_'.repeat(4-this.input.length));
      inp.style.letterSpacing = '.4em';
      wrap.appendChild(inp);
      const pad = el('div','math-pad');
      ['1','2','3','4','5','6','7','8','9'].forEach(n=>{
        const b = el('button','math-key', n);
        b.onclick = ()=>this.press(n);
        pad.appendChild(b);
      });
      const del = el('button','math-key del','⌫');
      del.onclick = ()=>this.delPress();
      pad.appendChild(del);
      const z = el('button','math-key', '0');
      z.onclick = ()=>this.press('0');
      pad.appendChild(z);
      const sk = el('button','math-key','SKIP');
      sk.style.background='rgba(255,255,255,.1)';
      sk.style.fontSize='13px';
      sk.onclick = ()=>this.next();
      pad.appendChild(sk);
      wrap.appendChild(pad);
    }
    area.appendChild(wrap);
  },
  end(){
    const won = this.score>=3;
    const rewards = won ? {coin:40+this.score*15, brain:4} : {coin:Math.max(10,this.score*8)};
    recordResult('speed','code',won,rewards);
    if(won) Modal.win({rewards, title:`${this.score}/5 codes!`, emoji:'🔑',
      retry:()=>CodeSprintGame.start(), lobby:()=>App.toLobby()});
    else Modal.lose({title:`${this.score}/5`,msg:'aim for 3+ codes!',
      retry:()=>CodeSprintGame.start(), lobby:()=>App.toLobby()});
  },
  cleanup(){ if(this.showTimer) clearTimeout(this.showTimer); }
};

// 🎫 BATTLE PASS S1 (v0.4)
// ====================================================================
const BP_TIERS = [
  {xp:5,em:'🪙',name:'100 coins',reward:{coin:100}},
  {xp:15,em:'💎',name:'1 gem',reward:{gem:1}},
  {xp:30,em:'🪙',name:'200 coins',reward:{coin:200}},
  {xp:50,em:'🗝️',name:'5 keys',reward:{key:5}},
  {xp:75,em:'🎫',name:'1 ticket',reward:{ticket:1}},
  {xp:110,em:'🪙',name:'500 coins',reward:{coin:500}},
  {xp:150,em:'💎',name:'5 gems',reward:{gem:5}},
  {xp:200,em:'✝️',name:'10 faith stars',reward:{faith:10}},
  {xp:260,em:'🪙',name:'1k coins',reward:{coin:1000}},
  {xp:340,em:'👑',name:'PENTECOST title',reward:{coin:500,gem:10}},
];
const BP = {
  addXp(n){
    if(!State.data.bp) State.data.bp = {xp:0, claimed:[]};
    State.data.bp.xp += n;
    Save.write();
  },
  currentTier(){
    if(!State.data.bp) return -1;
    let tier = -1;
    BP_TIERS.forEach((t,i)=>{ if(State.data.bp.xp>=t.xp) tier = i; });
    return tier;
  },
  claim(idx){
    const bp = State.data.bp;
    if(bp.claimed.includes(idx)) return false;
    if(bp.xp < BP_TIERS[idx].xp) return false;
    bp.claimed.push(idx);
    Wallet.add(BP_TIERS[idx].reward);
    Activity.log('ach','🎫',`Battle Pass tier ${idx+1} claimed`);
    Save.write();
    SFX.holy();
    haptic(30);
    confetti();
    return true;
  }
};

window.App = App; // expose for inline handlers
function _showFatal(e){
  const msg = (e && (e.message||String(e)))||'unknown error';
  const stack = (e && e.stack)||'';
  const html = '<div style="position:fixed;inset:0;background:#1E3A8A;color:#FFF8E7;padding:24px;font-family:monospace;overflow:auto;z-index:9999"><h2 style="color:#FBBF24;font-size:18px;margin-bottom:12px;font-family:serif">⚠️ BrainBoard error</h2><pre style="white-space:pre-wrap;font-size:13px;background:#0a1633;padding:14px;border-radius:8px;border:1px solid #F59E0B">'+msg+'\n\n'+stack+'</pre><div style="margin-top:14px;padding:14px;background:#0a1633;border-radius:8px"><b>Try:</b><br>1. tap below to clear save<br>2. then refresh</div><button onclick="try{localStorage.clear()}catch(e){};location.reload()" style="margin-top:14px;padding:14px 24px;background:#FBBF24;color:#0F172A;border:none;border-radius:99px;font-weight:800;font-size:15px;cursor:pointer">🗑️ CLEAR + RELOAD</button></div>';
  const div = document.createElement('div');
  div.innerHTML = html;
  document.body.appendChild(div);
}
window.addEventListener('error',(ev)=>_showFatal(ev.error||{message:ev.message,stack:''}));
let _initRan = false;
function _bootOnce(){
  if(_initRan) return;
  _initRan = true;
  try{ App.init(); }catch(e){
    console.error('BrainBoard boot fail',e);
    _showFatal(e);
  }
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', _bootOnce);
}else{
  _bootOnce();
}
// safety: also bind to window load as a last-ditch trigger
window.addEventListener('load', _bootOnce);
</script>
