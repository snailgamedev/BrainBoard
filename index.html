  rewards = _antiCheatClamp(rewards);
  // pass roomId so Modal.win can apply natural-faith rule without explicit param
  State._lastResultRoom = roomId;
  const key = `${roomId}:${gameId}`;
  if(!d.perGame[key]) d.perGame[key] = {wins:0,plays:0,best:0,lastWin:0};
  d.perGame[key].plays++;
  d.totals.games++;
  const gameDef = ROOMS[roomId]?.games.find(g=>g.id===gameId);
  const gName = gameDef ? gameDef.name : gameId;
  let isPR = false, comboMult = 1;
  if(won){
    // Combo multiplier (back-to-back wins)
    comboMult = Combo.bump(true);
    if(State._dailyMultiplier){
      Object.keys(rewards).forEach(k=>rewards[k]=Math.round(rewards[k]*State._dailyMultiplier));
      State._dailyMultiplier = null;
    }
    if(comboMult>1){
      Object.keys(rewards).forEach(k=>rewards[k]=Math.round(rewards[k]*comboMult));
    }
    // v0.28 EQUIPPED POWER-UP CONSUMPTION
    const ep = State._equippedPowerup;
    if(ep){
      if(ep==='double' && (State.data.powerups?.double||0)>0){
        Object.keys(rewards).forEach(k=>rewards[k]=Math.round(rewards[k]*2));
        State.data.powerups.double--;
        State.data._powerupUses = (State.data._powerupUses||0)+1;
        Toast.show('⚡ 2x bonus applied!');
      }else if(ep==='fire' && (State.data.powerups?.fire||0)>0){
        rewards.coin = (rewards.coin||0) + 50;
        rewards.brain = (rewards.brain||0) + 5;
        State.data.powerups.fire--;
        State.data._powerupUses = (State.data._powerupUses||0)+1;
        Toast.show('🔥 Holy Fire boost!');
      }
      if(ep==='double') Ach.unlock('double_used');
      if(ep==='fire') Ach.unlock('fire_used');
      State._equippedPowerup = null;
    }
    d.perGame[key].wins++;
    d.perGame[key].lastWin = Date.now();
    d.totals.wins++;
    const prevTier = getRankTier(d.iq);
    d.iq = Math.min(RANK_MAX, d.iq + rankDelta(d.iq, true));
    const newTier = getRankTier(d.iq);
    if(newTier.name !== prevTier.name){
      // TIER PROMOTION cinematic
      State._lastTierPromotion = newTier;
    }
    Wallet.add(rewards);
    DNA.bumpFromRoom(roomId);
    Activity.log('win','🏆',`won ${gName}${comboMult>1?` · ${comboMult}x combo!`:''}`);
    BP.addXp(2);
    // PR check (uses coin reward as approximate score for cross-game comparison)
    isPR = PR.check(roomId, gameId, true, rewards.coin||0);
    State._lastPR = isPR;
    State._lastCombo = comboMult;
  }else{
    Combo.bump(false);
    d.totals.losses++;
    d.iq = Math.max(0, d.iq + rankDelta(d.iq, false));
    Activity.log('loss','💪',`played ${gName}`);
    BP.addXp(1);
    State._lastPR = false;
    State._lastCombo = 1;
  }
  Quests.bump(roomId, won);
  Adaptive.push(won);
  Save.write();
  Ach.check();
  UI.updateWallet();
}

// ====================================================================
const WordleGame = {
  start(){
    State.gameInst = this;
    this.target = WORDS[Math.floor(Math.random()*WORDS.length)];
    this.row = 0; this.col = 0;
    this.guesses = Array(6).fill(null).map(()=>Array(5).fill(''));
    this.cellStates = Array(6).fill(null).map(()=>Array(5).fill(''));
    this.keyStates = {};
    this.done = false;
    this.startTime = Date.now();
    this.hintsUsed = 0;
    this.render();
    UI.show('game');
  },
  useHint(){
    if(this.done) return;
    if(!State.data.powerups?.hint || State.data.powerups.hint<1){
      Toast.show('no hint power-ups · buy in Shop');
      return;
    }
    // Reveal one letter as green in the current row that hasn't been revealed
    const target = this.target.split('');
    let revealed = -1;
    // Find an empty cell in current row to reveal
    for(let i=0;i<5;i++){
      if(!this.guesses[this.row][i]){
        this.guesses[this.row][i] = target[i];
        this.col = Math.max(this.col, i+1);
        revealed = i;
        break;
      }
    }
    if(revealed===-1){ Toast.show('row already filled'); return; }
    State.data.powerups.hint--;
    State.data._powerupUses = (State.data._powerupUses||0)+1;
    this.hintsUsed++;
    Save.write();
    SFX.chime(); haptic(20);
    Toast.show(`💡 revealed · ${target[revealed]}`);
    this.render();
  },
  render(){
    const stats = State.data.perGame['word:wordle']||{wins:0};
    setText('g-stats', `<b>5-Letter</b> · best wins: <b>${stats.wins}</b> · target hidden 👀`.replace(/<b>/g,'<b>'));
    const hints = State.data.powerups?.hint||0;
    document.getElementById('g-stats').innerHTML = `<b>📖 5-Letter</b> · row ${this.row+1}/6 · wins: <b>${stats.wins||0}</b>${hints>0?` <button onclick="WordleGame.useHint()" style="background:rgba(245,158,11,.25);border:1px solid var(--gold);color:var(--gold-bright);padding:2px 8px;border-radius:99px;font-size:10px;cursor:pointer;margin-left:6px">💡 HINT (${hints})</button>`:''}`;
    const area = document.getElementById('g-area');
    area.innerHTML = '';
    const grid = el('div','word-grid');
    for(let r=0;r<6;r++){
      const row = el('div','word-row');
      for(let c=0;c<5;c++){
        const ch = this.guesses[r][c];
        const st = this.cellStates[r][c];
        const cell = el('div',`word-cell ${ch?'filled':''} ${st}`, ch);
        row.appendChild(cell);
      }
      grid.appendChild(row);
    }
    area.appendChild(grid);
    // keyboard
    const kb = el('div','word-keyboard');
    const rows = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
    rows.forEach((rk,i)=>{
      const r = el('div','word-keyrow');
      if(i===2){
        const enter = el('button','word-key wide','ENTER');
        enter.onclick = ()=>this.submit();
        r.appendChild(enter);
      }
      [...rk].forEach(k=>{
        const b = el('button',`word-key ${this.keyStates[k]||''}`, k);
        b.onclick = ()=>this.input(k);
        r.appendChild(b);
      });
      if(i===2){
        const del = el('button','word-key wide','⌫');
        del.onclick = ()=>this.del();
        r.appendChild(del);
      }
      kb.appendChild(r);
    });
    area.appendChild(kb);
  },
  input(k){
    if(this.done || this.col>=5) return;
    this.guesses[this.row][this.col] = k;
    this.col++;
    haptic(5);
    SFX.tap();
    this.render();
  },
  del(){
    if(this.done || this.col===0) return;
    this.col--;
    this.guesses[this.row][this.col]='';
    haptic(5);
    this.render();
  },
  async submit(){
    if(this.done || this.col<5 || this._submitting) return;
    const guess = this.guesses[this.row].join('');
    // v0.14 anti-cheat: must be a real word (local set OR online dict fallback)
    this._submitting = true;
    let valid = isValidWord(guess);
    if(!valid){
      Toast.show('checking…');
      valid = await isValidWordAsync(guess);
    }
    this._submitting = false;
    if(!valid){
      Toast.show('🚫 not a real word');
      SFX.wrong(); haptic(20);
      const rows = document.querySelectorAll('.word-row');
      const cur = rows[this.row];
      if(cur){ cur.classList.add('shake-card'); setTimeout(()=>cur.classList.remove('shake-card'),350); }
      return;
    }
    // mark cells
    const target = this.target.split('');
    const states = Array(5).fill('gray');
    const used = Array(5).fill(false);
    for(let i=0;i<5;i++){
      if(guess[i]===target[i]){ states[i]='green'; used[i]=true; }
    }
    for(let i=0;i<5;i++){
      if(states[i]==='green') continue;
      for(let j=0;j<5;j++){
        if(!used[j] && guess[i]===target[j]){
          states[i]='yellow'; used[j]=true; break;
        }
      }
    }
    this.cellStates[this.row] = states;
    // update key states (best-state-wins)
    for(let i=0;i<5;i++){
      const k = guess[i], s = states[i];
      const cur = this.keyStates[k];
      if(!cur || (cur==='gray'&&s!=='gray') || (cur==='yellow'&&s==='green')) this.keyStates[k]=s;
    }
    if(guess===this.target){
      this.done=true;
      const time = ((Date.now()-this.startTime)/1000).toFixed(1);
      const baseCoins = 60 + (5-this.row)*15;
      const rewards = {coin:baseCoins, brain:5, faith:1};
      recordResult('word','wordle',true,rewards);
      this.render();
      setTimeout(()=>{
        Modal.win({rewards, title:'WELL DONE!', emoji:'🎉',
          retry:()=>WordleGame.start(),
          lobby:()=>App.toLobby()});
      },500);
    }else if(this.row>=5){
      this.done=true;
      recordResult('word','wordle',false);
      this.render();
      setTimeout(()=>{
        Modal.lose({title:'so close!',msg:'better luck next time, saint',answer:this.target,
          retry:()=>WordleGame.start(),
          lobby:()=>App.toLobby()});
      },500);
    }else{
      this.row++; this.col=0;
      SFX.tap();
      haptic(15);
      this.render();
    }
  },
  cleanup(){}
};

const MemoryGame = {
  start(){
    State.gameInst = this;
    const symbols = ['🦁','🐑','🕊️','🌟','📖','✝️','🔥','🌿'];
    this.cards = [...symbols, ...symbols].sort(()=>Math.random()-.5);
    this.flipped = []; this.matched = new Set(); this.moves = 0;
    this.startTime = Date.now();
    this.render();
    UI.show('game');
  },
  render(){
    document.getElementById('g-stats').innerHTML = `<b>🧠 Memory Match</b> · moves: <b>${this.moves}</b> · matched: <b>${this.matched.size/2}/8</b>`;
    const area = document.getElementById('g-area');
    area.innerHTML = '';
    const grid = el('div','mem-grid');
    grid.style.gridTemplateColumns='repeat(4,1fr)';
    this.cards.forEach((sym,i)=>{
      const c = el('div',`mem-card ${this.flipped.includes(i)?'flipped':''} ${this.matched.has(i)?'matched':''}`,
        `<span class="face">${sym}</span>`);
      c.onclick = ()=>this.flip(i);
      grid.appendChild(c);
    });
    area.appendChild(grid);
  },
  flip(i){
    if(this.flipped.includes(i)||this.matched.has(i)||this.flipped.length>=2) return;
    this.flipped.push(i);
    SFX.tap();
    haptic(5);
    this.render();
    if(this.flipped.length===2){
      this.moves++;
      const [a,b] = this.flipped;
      if(this.cards[a]===this.cards[b]){
        setTimeout(()=>{
          this.matched.add(a); this.matched.add(b);
          this.flipped=[];
          SFX.correct();
          haptic(15);
          this.render();
          if(this.matched.size===this.cards.length){
            const baseCoins = Math.max(40, 200 - this.moves*8);
            const rewards = {coin:baseCoins, brain:4};
            recordResult('brain','memory',true,rewards);
            setTimeout(()=>Modal.win({rewards, title:`Matched in ${this.moves} moves!`, emoji:'🎉',
              retry:()=>MemoryGame.start(), lobby:()=>App.toLobby()}),500);
          }
        },400);
      }else{
        setTimeout(()=>{
          this.flipped=[];
          SFX.wrong();
          this.render();
        },800);
      }
    }
  },
  cleanup(){}
};

      if(i>=this.sequence.length){

const ReactionGame = {
  start(){
    State.gameInst=this;
    this.round=0; this.times=[]; this.state='wait';
    this.next();
    UI.show('game');
  },
  next(){
    this.state='wait'; this.render();
    const wait = 1500+Math.random()*2500;
    this.timer = setTimeout(()=>{
      this.state='go';
      this.startTime=Date.now();
      SFX.tap();
      this.render();
    }, wait);
  },
  tap(){
    if(this.state==='wait'){
      clearTimeout(this.timer);
      this.state='early'; SFX.wrong(); haptic(30); this.render();
      setTimeout(()=>this.next(),1500);
      return;
    }
    if(this.state==='go'){
      const t=Date.now()-this.startTime;
      this.times.push(t);
      this.round++;
      SFX.correct(); haptic(10);

      setTimeout(()=>this.next(),700);

// 🎮 GAME 10 · SEQUENCE SOLVE (Number Crunch)
// ====================================================================
const SequenceGame = {
  start(){
    State.gameInst=this;
    this.score=0; this.timeLeft=60;
    this.next();
    this.timer = setInterval(()=>{
      this.timeLeft--;
      if(this.timeLeft<=0){this.end();return;}
      this.render();
    },1000);
    UI.show('game');
  },
  next(){
    const patterns=[
      ()=>{const a=Math.floor(Math.random()*5)+1; const d=Math.floor(Math.random()*5)+1; return {seq:[a,a+d,a+2*d,a+3*d], next:a+4*d};},
      ()=>{const a=Math.floor(Math.random()*4)+1; return {seq:[a,a*2,a*4,a*8], next:a*16};},
      ()=>({seq:[1,4,9,16], next:25}),
      ()=>({seq:[1,1,2,3], next:5}),
      ()=>({seq:[2,3,5,8], next:13}),
      ()=>{const a=Math.floor(Math.random()*30)+50; const d=Math.floor(Math.random()*5)+2; return {seq:[a,a-d,a-2*d,a-3*d], next:a-4*d};},
      ()=>({seq:[3,6,12,24], next:48}),
      ()=>({seq:[1,3,6,10], next:15}),
    ];
    const p = patterns[Math.floor(Math.random()*patterns.length)]();
    this.q=p.seq; this.answer=p.next;
    const distract=[];
    while(distract.length<3){
      const d = p.next + (Math.random()<.5?-1:1)*(Math.floor(Math.random()*5)+1);
      if(d!==p.next && !distract.includes(d) && d>0) distract.push(d);
    }
    this.options=[p.next,...distract].sort(()=>Math.random()-.5);
    this.render();
  },
  render(){
    document.getElementById('g-stats').innerHTML = `<b>🔢 Sequence</b> · score: <b>${this.score}</b> · ⏱ <b>${this.timeLeft}s</b>`;
    const area = document.getElementById('g-area');

    const wrap = el('div','stroop-area');
    wrap.appendChild(el('div','dim','find the next number'));
    wrap.appendChild(el('div','math-q', this.q.join(', ') + ', ?'));
    const grid = el('div','stroop-grid');
    this.options.forEach(o=>{
      const b = el('button','stroop-btn', String(o));
      b.style.background='linear-gradient(135deg,#0E7490,#0C4A6E)';
      b.onclick=()=>this.pick(o);
      grid.appendChild(b);
    });
    wrap.appendChild(grid);
    area.appendChild(wrap);
  },
  pick(o){
    if(o===this.answer){ this.score++; SFX.correct(); haptic(8); }
    else{ this.score=Math.max(0,this.score-1); SFX.wrong(); haptic(20); }
    this.next();
  },
  end(){
    clearInterval(this.timer);
    const won = this.score>=6;
    const rewards = won ? {coin:30+this.score*5, brain:3} : {coin:Math.max(10,this.score*3)};
    recordResult('num','sequence',won,rewards);
    if(won) Modal.win({rewards, title:`Solved ${this.score}!`, emoji:'🧮',
      retry:()=>SequenceGame.start(), lobby:()=>App.toLobby()});
    else Modal.lose({title:`Solved ${this.score}`,msg:'aim for 6+ correct!',
      retry:()=>SequenceGame.start(), lobby:()=>App.toLobby()});
  },
  cleanup(){ if(this.timer) clearInterval(this.timer); }
};

// 🎮 GAME 12 · LIGHTS OUT (Logic Lab)
// ====================================================================
const LightsGame = {
  start(){
    State.gameInst=this;
    this.grid = Array(9).fill(false);
    const taps = 3 + Math.floor(Math.random()*3);
    const used = new Set();
    while(used.size<taps){
      const i = Math.floor(Math.random()*9);
      if(used.has(i)) continue;
      used.add(i);
      this._toggle(i);
    }
    this.moves = 0; this.done = false;
    this.startTime = Date.now();
    this.render();
    UI.show('game');
  },
  _toggle(i){
    const flip=(idx)=>{ if(idx>=0&&idx<9) this.grid[idx]=!this.grid[idx]; };
    flip(i);
    const r=Math.floor(i/3), c=i%3;
    if(c>0) flip(i-1);
    if(c<2) flip(i+1);
    if(r>0) flip(i-3);
    if(r<2) flip(i+3);
  },
  tap(i){
    if(this.done) return;
    SFX.tap(); haptic(8);
    this._toggle(i);
    this.moves++;
    if(this.grid.every(x=>!x)){
      this.done=true;
      this.render();
      const won = this.moves<=10;
      const rewards = won ? {coin:50+(11-this.moves)*6, brain:3} : {coin:30, brain:1};
      recordResult('logic','lights',true,rewards);
      setTimeout(()=>Modal.win({rewards, title:`Cleared in ${this.moves} moves!`, emoji:'💡',
        retry:()=>LightsGame.start(), lobby:()=>App.toLobby()}),400);
      return;
    }
    this.render();
  },
  render(){
    document.getElementById('g-stats').innerHTML = `<b>🧩 Lights Out</b> · moves: <b>${this.moves}</b> · turn ALL off!`;
    const area = document.getElementById('g-area');
    area.innerHTML = '';

};

const HuntGame = {
  start(){
    State.gameInst=this;
    this.score=0; this.timeLeft=45;
    this.next();
    this.timer = setInterval(()=>{
      this.timeLeft--;
      if(this.timeLeft<=0){this.end();return;}
      this.render();
    },1000);
    UI.show('game');
  },
  next(){
    const size = 8;
    const used = new Set();
    const nums = [];
    while(nums.length<size-1){
      const n = Math.floor(Math.random()*89)+10;
      if(!used.has(n)){ used.add(n); nums.push(n); }
    }
    // pick one to duplicate
    const dup = nums[Math.floor(Math.random()*nums.length)];
    nums.push(dup);
    this.target = dup;
    this.nums = nums.sort(()=>Math.random()-.5);
    this.dupIndices = [];
    this.nums.forEach((n,i)=>{ if(n===dup) this.dupIndices.push(i); });
    this.tapped = new Set();
    this.render();
  },
  render(){
    document.getElementById('g-stats').innerHTML = `<b>🧩 Number Hunt</b> · score: <b>${this.score}</b> · ⏱ <b>${this.timeLeft}s</b>`;
    const area = document.getElementById('g-area');
    area.innerHTML = '';
    const wrap = el('div','stroop-area');
    wrap.appendChild(el('div','dim','tap BOTH copies of the duplicated number'));
    const grid = el('div','');

const WhackGame = {
  start(){
    State.gameInst=this;
    this.score=0; this.timeLeft=30;
    this.activeIdx = -1;
    this.target = '🌟';
    this.next();
    this.timer = setInterval(()=>{

  spawn(){
    const idx = Math.floor(Math.random()*9);
    const isTarget = Math.random()<.6;
    this.activeIdx = idx;
    this.activeIsTarget = isTarget;
    this.activeEmoji = isTarget ? this.target : ['❌','💣','🚫'][Math.floor(Math.random()*3)];
    this.render();
  },
  next(){ this.render(); },
  render(){
    document.getElementById('g-stats').innerHTML = `<b>⚡ Whack-a-Star</b> · score: <b>${this.score}</b> · ⏱ <b>${this.timeLeft}s</b>`;
    const area = document.getElementById('g-area');
    area.innerHTML = '';
    const wrap = el('div','stroop-area');
    wrap.appendChild(el('div','dim','tap 🌟 only · NOT bombs/Xs'));
    const grid = el('div','');
    grid.style.cssText='display:grid;grid-template-columns:repeat(3,76px);gap:8px;margin:14px 0';
    for(let i=0;i<9;i++){
      const c = el('div','');
      const isActive = i===this.activeIdx;
      c.style.cssText = `aspect-ratio:1;border-radius:14px;background:${isActive?'rgba(245,158,11,.25)':'rgba(255,255,255,.08)'};border:2px solid ${isActive?'#F59E0B':'rgba(255,255,255,.16)'};display:grid;place-items:center;font-size:42px;cursor:pointer`;
      c.textContent = isActive ? this.activeEmoji : '';
      c.onclick=()=>this.tap(i);
      grid.appendChild(c);
    }
    wrap.appendChild(grid);
    area.appendChild(wrap);
  },
  tap(i){
    if(i!==this.activeIdx) return;
    if(this.activeIsTarget){ this.score++; SFX.correct(); haptic(8); }
    else{ this.score=Math.max(0,this.score-2); SFX.wrong(); haptic(30); }
    this.activeIdx = -1;

  end(){
    clearInterval(this.timer);
    clearInterval(this.spawnTimer);
    const won = this.score>=12;
    const rewards = won ? {coin:30+this.score*4, brain:3} : {coin:Math.max(10,this.score*2)};
    recordResult('speed','whack',won,rewards);
    if(won) Modal.win({rewards, title:`Whacked ${this.score}!`, emoji:'🌟',
      retry:()=>WhackGame.start(), lobby:()=>App.toLobby()});
    else Modal.lose({title:`Score ${this.score}`,msg:'aim for 12+ stars!',
      retry:()=>WhackGame.start(), lobby:()=>App.toLobby()});
  },
  cleanup(){
    if(this.timer) clearInterval(this.timer);
    if(this.spawnTimer) clearInterval(this.spawnTimer);
  }
};

// 🎮 GAME 17 · CODE SPRINT (Speed Wing)
// ====================================================================
const CodeSprintGame = {
  start(){
    State.gameInst=this;
    this.round=0; this.score=0;
    this.next();
    UI.show('game');
  },
  next(){
    if(this.round>=5){this.end();return;}
    this.round++;
    this.code = '';
    for(let i=0;i<4;i++) this.code += Math.floor(Math.random()*10);
    this.input = '';
    this.phase = 'show';
    this.render();
    this.showTimer = setTimeout(()=>{
      this.phase = 'input';
      this.render();
    }, 1500);
  },
  press(n){
    if(this.phase!=='input') return;
    if(this.input.length>=4) return;
    this.input += n;
    SFX.tap();
    haptic(4);
    if(this.input.length===4){
      // submit
      if(this.input===this.code){ this.score++; SFX.correct(); haptic(15); }
      else{ SFX.wrong(); haptic(30); }
      setTimeout(()=>this.next(), 600);
    }
    this.render();
  },
  delPress(){
    if(this.phase!=='input') return;
    this.input = this.input.slice(0,-1);
    haptic(4);
    this.render();
  },
  render(){
    document.getElementById('g-stats').innerHTML = `<b>⚡ Code Sprint</b> · round <b>${this.round}/5</b> · score <b>${this.score}</b>`;
    const area = document.getElementById('g-area');
    area.innerHTML = '';
    const wrap = el('div','stroop-area');
    if(this.phase==='show'){
      wrap.appendChild(el('div','dim','memorize this code · 1.5s'));
      const big = el('div','math-q', this.code.split('').join(' '));
      big.style.color = 'var(--gold-bright)';
      big.style.fontSize='56px';
      wrap.appendChild(big);
    }else{
      wrap.appendChild(el('div','dim','type the code'));
      const inp = el('div','math-input', this.input + '_'.repeat(4-this.input.length));
      inp.style.letterSpacing = '.4em';
      wrap.appendChild(inp);
      const pad = el('div','math-pad');
      ['1','2','3','4','5','6','7','8','9'].forEach(n=>{
        const b = el('button','math-key', n);
        b.onclick = ()=>this.press(n);
        pad.appendChild(b);
      });
      const del = el('button','math-key del','⌫');
      del.onclick = ()=>this.delPress();
      pad.appendChild(del);
      const z = el('button','math-key', '0');
      z.onclick = ()=>this.press('0');
      pad.appendChild(z);
      const sk = el('button','math-key','SKIP');
      sk.style.background='rgba(255,255,255,.1)';
      sk.style.fontSize='13px';
      sk.onclick = ()=>this.next();
      pad.appendChild(sk);
      wrap.appendChild(pad);
    }
    area.appendChild(wrap);
  },
  end(){
    const won = this.score>=3;
    const rewards = won ? {coin:40+this.score*15, brain:4} : {coin:Math.max(10,this.score*8)};
    recordResult('speed','code',won,rewards);
    if(won) Modal.win({rewards, title:`${this.score}/5 codes!`, emoji:'🔑',
      retry:()=>CodeSprintGame.start(), lobby:()=>App.toLobby()});
    else Modal.lose({title:`${this.score}/5`,msg:'aim for 3+ codes!',
      retry:()=>CodeSprintGame.start(), lobby:()=>App.toLobby()});
  },
  cleanup(){ if(this.showTimer) clearTimeout(this.showTimer); }
};

  {xp:5,em:'🪙',name:'100 coins',reward:{coin:100}},
  {xp:15,em:'💎',name:'1 gem',reward:{gem:1}},
  {xp:30,em:'🪙',name:'200 coins',reward:{coin:200}},
  {xp:50,em:'🗝️',name:'5 keys',reward:{key:5}},
  {xp:75,em:'🎫',name:'1 ticket',reward:{ticket:1}},
  {xp:110,em:'🪙',name:'500 coins',reward:{coin:500}},
  {xp:150,em:'💎',name:'5 gems',reward:{gem:5}},
  {xp:200,em:'✝️',name:'10 faith stars',reward:{faith:10}},
  {xp:260,em:'🪙',name:'1k coins',reward:{coin:1000}},
  {xp:340,em:'👑',name:'PENTECOST title',reward:{coin:500,gem:10}},
];
const BP = {
  addXp(n){
    if(!State.data.bp) State.data.bp = {xp:0, claimed:[]};
    State.data.bp.xp += n;
    Save.write();
  },
  currentTier(){
    if(!State.data.bp) return -1;
    let tier = -1;
    BP_TIERS.forEach((t,i)=>{ if(State.data.bp.xp>=t.xp) tier = i; });
    return tier;
  },
  claim(idx){
    const bp = State.data.bp;
    if(bp.claimed.includes(idx)) return false;
    if(bp.xp < BP_TIERS[idx].xp) return false;
    bp.claimed.push(idx);
    Wallet.add(BP_TIERS[idx].reward);
    Activity.log('ach','🎫',`Battle Pass tier ${idx+1} claimed`);
    Save.write();
    SFX.holy();
    haptic(30);
    confetti();
    return true;
  }
};

const NumberTapGame = {
  start(){
    State.gameInst=this;
    this.target=1;
    this.startTime=Date.now();
    this.numbers=Array.from({length:15},(_,i)=>i+1).sort(()=>Math.random()-.5);
    this.tapped=new Set();
    this.render();
    // v0.17 only update timer text on tick · don't full-rebuild grid (allows fast tapping)
    this.tickInt = setInterval(()=>{
      const elapsed=((Date.now()-this.startTime)/1000).toFixed(1);
      const stats = document.getElementById('g-stats');
      if(stats) stats.innerHTML = `<b>⚡ Number Tap</b> · next: <b>${this.target}</b>/15 · ⏱ <b>${elapsed}s</b>`;
    }, 200);
    UI.show('game');
  },
  tap(n){
    if(n!==this.target){ SFX.wrong(); haptic(20); return; }
    this.tapped.add(n);
    this.target++;
    SFX.correct(); haptic(6);
    if(this.target>15){
      clearInterval(this.tickInt);
      const time=((Date.now()-this.startTime)/1000).toFixed(1);
      const t=parseFloat(time);
      const won=t<=20;
      const rewards=won?{coin:Math.max(50,300-Math.round(t*8)),brain:4}:{coin:30};
      recordResult('speed','numbertap',won,rewards);
      if(won) Modal.win({rewards,title:`Cleared in ${time}s · ⚡`,emoji:'⚡',
        retry:()=>NumberTapGame.start(),lobby:()=>App.toLobby()});
      else Modal.lose({title:`${time}s`,msg:'sub-20s for the win!',
        retry:()=>NumberTapGame.start(),lobby:()=>App.toLobby()});
      return;
    }
    this.render();
  },
  render(){
    const elapsed=((Date.now()-this.startTime)/1000).toFixed(1);
    document.getElementById('g-stats').innerHTML = `<b>⚡ Number Tap</b> · next: <b>${this.target}</b>/15 · ⏱ <b>${elapsed}s</b>`;
    const area=document.getElementById('g-area');
    area.innerHTML='';
    const wrap=el('div','stroop-area');
    wrap.appendChild(el('div','dim','tap numbers in order 1→15'));
    const grid=el('div','');
    grid.style.cssText='display:grid;grid-template-columns:repeat(3,76px);gap:8px;margin:14px 0';
    this.numbers.forEach(n=>{
      const c=el('div','');
      const isTapped=this.tapped.has(n);
      c.style.cssText=`aspect-ratio:1;border-radius:14px;background:${isTapped?'rgba(16,185,129,.5)':'rgba(255,255,255,.08)'};border:2px solid ${isTapped?'#10B981':'rgba(255,255,255,.18)'};display:grid;place-items:center;font-size:24px;font-weight:800;cursor:${isTapped?'default':'pointer'};font-family:'Cinzel',serif;color:${isTapped?'rgba(255,255,255,.5)':'var(--cream)'}`;
      c.textContent=n;
      if(!isTapped) c.onclick=()=>this.tap(n);
      grid.appendChild(c);
    });
    wrap.appendChild(grid);
    area.appendChild(wrap);
  },
  cleanup(){ if(this.tickInt) clearInterval(this.tickInt); }
};

const HangmanGame = {
  start(){
    State.gameInst=this;
    this.target = HANG_WORDS[Math.floor(Math.random()*HANG_WORDS.length)];
    this.guessed = new Set();
    this.wrong = 0;
    this.maxWrong = 6;
    this.done = false;
    this.render();
    UI.show('game');
  },
  guess(letter){
    if(this.done || this.guessed.has(letter)) return;
    this.guessed.add(letter);
    if(!this.target.includes(letter)){
      this.wrong++;
      SFX.wrong(); haptic(15);
      if(this.wrong >= this.maxWrong){
        this.done = true;
        this.render();
        recordResult('word','hangman',false,{coin:Math.max(10,(this.target.length-this.wrong)*4)});
        setTimeout(()=>Modal.lose({title:'Hung!',msg:'better luck next time',answer:this.target,
          retry:()=>HangmanGame.start(),lobby:()=>App.toLobby()}),400);
        return;
      }
    }else{
      SFX.correct(); haptic(8);
      // Check win
      const allGuessed = [...this.target].every(c=>this.guessed.has(c));
      if(allGuessed){
        this.done = true;
        this.render();
        const reward = {coin: 60 + (this.maxWrong-this.wrong)*15, brain:3};
        recordResult('word','hangman',true,reward);
        setTimeout(()=>Modal.win({rewards:reward,title:`Saved! ${this.maxWrong-this.wrong} chances left`,emoji:'🎉',
          retry:()=>HangmanGame.start(),lobby:()=>App.toLobby()}),400);
        return;
      }
    }
    this.render();
  },
  cashOut(){
    if(this.wrong < this.maxWrong){
      const correctLetters = [...this.target].filter(c=>this.guessed.has(c)).length;
      if(correctLetters>=2) return {coin: correctLetters*8};
    }
    return null;
  },
  render(){
    const lives = this.maxWrong - this.wrong;
    document.getElementById('g-stats').innerHTML = `<b>📖 Hangman</b> · lives: <b>${'❤️'.repeat(lives)}${'🖤'.repeat(this.wrong)}</b>`;
    const area=document.getElementById('g-area');
    area.innerHTML='';
    const wrap=el('div','stroop-area');
    // Word display with blanks
    const wordHtml = [...this.target].map(c=>this.guessed.has(c)?c:'_').join(' ');
    const w = el('div','math-q', wordHtml);
    w.style.color = 'var(--gold-bright)';
    w.style.fontFamily="'Cinzel',serif";
    w.style.letterSpacing='.1em';
    wrap.appendChild(w);
    // Wrong letters
    const wrongLetters = [...this.guessed].filter(c=>!this.target.includes(c));
    if(wrongLetters.length){
      wrap.appendChild(el('div','dim','tried: '+wrongLetters.join(' ')));
    }
    // Keyboard
    const kb = el('div','word-keyboard');
    const rows = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
    rows.forEach(rk=>{
      const r = el('div','word-keyrow');
      [...rk].forEach(k=>{
        const used = this.guessed.has(k);
        const isRight = used && this.target.includes(k);
        const isWrong = used && !this.target.includes(k);
        const cls = isRight?'green':isWrong?'gray':'';
        const b = el('button',`word-key ${cls}`, k);
        if(!used && !this.done) b.onclick=()=>this.guess(k);
        r.appendChild(b);
      });
      kb.appendChild(r);
    });
    wrap.appendChild(kb);
    area.appendChild(wrap);
  },
  cleanup(){}
};

const SudokuGame = {
  start(){
    State.gameInst=this;
    // Generate a valid filled 4x4 sudoku then remove cells based on difficulty
    this.solution = SudokuGame.generateSolved();
    const diff = State.data._sudokuDiff || 'normal';
    this.difficulty = diff;
    const removeCount = diff==='easy'?6:diff==='hard'?11:8;
    this.given = this.solution.map(r=>[...r]);
    const positions = [];
    for(let r=0;r<4;r++) for(let c=0;c<4;c++) positions.push([r,c]);
    positions.sort(()=>Math.random()-.5);
    for(let i=0;i<removeCount;i++){
      const [r,c] = positions[i];
      this.given[r][c] = 0;
    }
    this.user = this.given.map(r=>[...r]);
    this.selected = null;
    this.startMs = Date.now();
    this.errors = 0;
    this.render();
    UI.show('game');
  },
  generateSolved(){
    // 4x4 sudoku: 4 numbers × 4 rows. 4 quadrants of 2x2.
    // Latin-square-like construction
    const base = [[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]];
    // Randomize: shuffle rows within bands, cols within stacks, swap digit values
    const shuffleArr = a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;};
    // Permute digits 1-4
    const perm = shuffleArr([1,2,3,4]);
    let g = base.map(row=>row.map(v=>perm[v-1]));
    // Swap rows within bands
    if(Math.random()<.5) [g[0],g[1]]=[g[1],g[0]];
    if(Math.random()<.5) [g[2],g[3]]=[g[3],g[2]];
    // Swap columns within stacks
    if(Math.random()<.5) g.forEach(r=>[r[0],r[1]]=[r[1],r[0]]);
    if(Math.random()<.5) g.forEach(r=>[r[2],r[3]]=[r[3],r[2]]);
    return g;
  },
  select(r,c){
    if(this.given[r][c]!==0) return; // can't select pre-filled cell
    this.selected = [r,c];
    this.render();
  },
  setNum(n){
    if(!this.selected) return;
    const [r,c] = this.selected;
    this.user[r][c] = n;
    SFX.tap(); haptic(5);
    if(this.solution[r][c]!==n){ this.errors++; SFX.wrong(); haptic(15); }
    this.checkWin();
    this.render();
  },
  checkWin(){
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){
      if(this.user[r][c]!==this.solution[r][c]) return;
    }
    // Win!
    const time = ((Date.now()-this.startMs)/1000).toFixed(1);
    const won = this.errors<=2;
    const reward = won?{coin:80+Math.max(0,(20-this.errors*5)*5)+(this.difficulty==='hard'?50:this.difficulty==='easy'?10:30), brain:4}:{coin:30};
    recordResult('logic','sudoku',true,reward);
    setTimeout(()=>Modal.win({rewards:reward,title:`Solved in ${time}s · ${this.errors} errors`,emoji:'🧩',
      retry:()=>SudokuGame.start(),lobby:()=>App.toLobby()}),400);
    this.done = true;
  },
  cashOut(){
    const filled = this.user.flat().filter(v=>v!==0).length - this.given.flat().filter(v=>v!==0).length;
    if(filled<3) return null;
    return {coin: filled*6};
  },
  render(){
    const time = ((Date.now()-this.startMs)/1000).toFixed(1);
    document.getElementById('g-stats').innerHTML = `<b>🧩 Sudoku Mini</b> · errors: <b>${this.errors}</b> · ⏱ <b>${time}s</b> · ${this.difficulty}`;
    const area=document.getElementById('g-area');
    area.innerHTML='';
    const wrap=el('div','stroop-area');
    wrap.appendChild(el('div','dim','fill 1-4 · no repeats in row/col/box'));
    // Grid
    const grid = el('div','');
    grid.style.cssText='display:grid;grid-template-columns:repeat(4,60px);grid-template-rows:repeat(4,60px);gap:2px;background:rgba(255,255,255,.2);padding:2px;border-radius:10px;margin:14px 0';
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){
      const isGiven = this.given[r][c]!==0;
      const isSel = this.selected && this.selected[0]===r && this.selected[1]===c;
      const v = this.user[r][c]||'';
      const isWrong = !isGiven && v && v!==this.solution[r][c];
      const cell = el('div','');
      // Quadrant border thicker
      const borderTop = (r%2===0 && r>0) ? '3px solid var(--gold)' : '0';
      const borderLeft = (c%2===0 && c>0) ? '3px solid var(--gold)' : '0';
      cell.style.cssText=`background:${isSel?'rgba(245,158,11,.3)':isGiven?'rgba(0,0,0,.3)':'rgba(255,255,255,.08)'};border:1px solid rgba(255,255,255,.1);border-top:${borderTop};border-left:${borderLeft};display:grid;place-items:center;font-size:24px;font-weight:800;font-family:'Cinzel',serif;cursor:${isGiven?'default':'pointer'};color:${isWrong?'#EF4444':isGiven?'var(--cream)':'var(--gold-bright)'}`;
      cell.textContent = v;
      if(!isGiven) cell.onclick=()=>this.select(r,c);
      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
    // Number pad
    const pad = el('div','');
    pad.style.cssText='display:flex;gap:8px;margin-top:8px';
    [1,2,3,4].forEach(n=>{
      const b = el('button','math-key', String(n));
      b.style.cssText='width:54px;height:54px;font-size:22px;background:rgba(124,58,237,.25);border:1px solid rgba(124,58,237,.5);color:var(--cream);font-weight:800;border-radius:10px;cursor:pointer';
      b.onclick=()=>this.setNum(n);
      pad.appendChild(b);
    });
    const erase = el('button','math-key', '⌫');
    erase.style.cssText='width:54px;height:54px;font-size:18px;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.5);color:var(--cream);border-radius:10px;cursor:pointer';
    erase.onclick=()=>this.setNum(0);
    pad.appendChild(erase);
    wrap.appendChild(pad);
    // Difficulty selector (only at start)
    if(this.user.flat().filter(v=>v!==0).length === this.given.flat().filter(v=>v!==0).length){
      const diffRow = el('div','');
      diffRow.style.cssText='display:flex;gap:6px;margin-top:10px';
      ['easy','normal','hard'].forEach(d=>{
        const b = el('button','av-tool-btn', d.toUpperCase());
        if(d===this.difficulty) b.classList.add('active');
        b.onclick=()=>{
          State.data._sudokuDiff = d;
          Save.write();
          SudokuGame.start();
        };
        diffRow.appendChild(b);
      });
      wrap.appendChild(diffRow);
    }
    area.appendChild(wrap);
  },
  cleanup(){}
};

const NumberMemoryGame = {
  start(){
    State.gameInst=this;
    this.round=0; this.score=0;
    this.next();
    UI.show('game');
  },
  next(){
    if(this.round>=5){this.end();return;}
    this.round++;
    this.numbers=Array.from({length:5},()=>Math.floor(Math.random()*90)+10);
    this.target = Math.floor(Math.random()*5);
    this.phase='show';
    this.input='';
    this.render();
    this.showT=setTimeout(()=>{this.phase='ask';this.render();},2500);
  },
  press(n){
    if(this.phase!=='ask')return;
    if(this.input.length>=2)return;
    this.input+=n; SFX.tap(); haptic(4);
    if(this.input.length===2){
      const guess=parseInt(this.input);
      if(guess===this.numbers[this.target]){this.score++; SFX.correct(); haptic(15);}else{SFX.wrong(); haptic(30);}
      setTimeout(()=>this.next(),700);
    }
    this.render();
  },
  delPress(){if(this.phase!=='ask')return; this.input=this.input.slice(0,-1); this.render();},
  render(){
    document.getElementById('g-stats').innerHTML=`<b>🧠 Number Memory</b> · round <b>${this.round}/5</b> · score <b>${this.score}</b>`;
    const area=document.getElementById('g-area'); area.innerHTML='';

      wrap.appendChild(el('div','dim','memorize all 5 · 2.5 sec'));

        const c=el('div',''); c.style.cssText='aspect-ratio:1;background:rgba(124,58,237,.25);border:2px solid #7C3AED;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:800;font-family:"Cinzel",serif;color:var(--gold-bright)';

// 🎮 GAME 34 · DROP FOUR (Logic Lab) · Connect-4 style vs CPU
// ====================================================================
const DropFourGame = {
  start(){
    State.gameInst=this;
    this.cols=7; this.rows=6;
    this.grid=Array.from({length:this.rows},()=>Array(this.cols).fill(0)); // 0=empty, 1=you, 2=cpu
    this.turn=1; this.done=false; this.winner=0;
    this.render();
    UI.show('game');
  },
  drop(col){
    if(this.done || this.turn!==1) return;
    // find lowest empty row
    let r=-1;
    for(let i=this.rows-1;i>=0;i--){ if(this.grid[i][col]===0){r=i;break;} }
    if(r<0) return; // column full
    this.grid[r][col]=1;
    SFX.tap(); haptic(8);
    if(this.check(r,col,1)){ this.done=true; this.winner=1; this.end(); return; }
    if(this.isFull()){ this.done=true; this.end(); return; }
    this.turn=2;
    this.render();
    setTimeout(()=>this.cpuMove(),700);
  },
  cpuMove(){
    if(this.done) return;
    // CPU: 60% random, 40% try to win/block
    let col = -1;
    if(Math.random()<0.4){
      // Try to win or block
      for(let c=0;c<this.cols;c++){
        const r = this._findRow(c);
        if(r<0) continue;
        this.grid[r][c]=2;
        if(this.check(r,c,2)){ this.grid[r][c]=0; col=c; break; }
        this.grid[r][c]=0;
      }
      if(col<0){
        for(let c=0;c<this.cols;c++){
          const r = this._findRow(c);
          if(r<0) continue;
          this.grid[r][c]=1;
          if(this.check(r,c,1)){ this.grid[r][c]=0; col=c; break; }
          this.grid[r][c]=0;
        }
      }
    }
    if(col<0){
      const opts=[];
      for(let c=0;c<this.cols;c++) if(this._findRow(c)>=0) opts.push(c);
      col = opts[Math.floor(Math.random()*opts.length)];
    }
    const r = this._findRow(col);
    if(r<0) return;
    this.grid[r][col]=2;
    SFX.tap();
    if(this.check(r,col,2)){ this.done=true; this.winner=2; this.end(); return; }
    if(this.isFull()){ this.done=true; this.end(); return; }
    this.turn=1;
    this.render();
  },
  _findRow(col){
    for(let i=this.rows-1;i>=0;i--){ if(this.grid[i][col]===0) return i; }
    return -1;
  },
  isFull(){return this.grid[0].every(c=>c!==0);},
  check(row,col,p){
    const dirs=[[0,1],[1,0],[1,1],[1,-1]];
    for(const [dr,dc] of dirs){
      let count=1;
      for(let s=1;s<4;s++){
        const r=row+dr*s, c=col+dc*s;
        if(r<0||r>=this.rows||c<0||c>=this.cols||this.grid[r][c]!==p) break;
        count++;
      }
      for(let s=1;s<4;s++){
        const r=row-dr*s, c=col-dc*s;
        if(r<0||r>=this.rows||c<0||c>=this.cols||this.grid[r][c]!==p) break;
        count++;
      }
      if(count>=4) return true;
    }
    return false;
  },
  render(){
    document.getElementById('g-stats').innerHTML=`<b>🧩 Drop Four</b> · ${this.turn===1?'your turn':'CPU thinking...'}${this.done?' · done':''}`;
    const area=document.getElementById('g-area'); area.innerHTML='';
    const wrap=el('div','stroop-area');
    wrap.appendChild(el('div','dim','drop 4 in a row · vs CPU'));
    const grid=el('div','');
    grid.style.cssText='display:grid;grid-template-columns:repeat(7,42px);gap:3px;background:rgba(245,158,11,.3);padding:6px;border-radius:14px;margin:14px 0';
    for(let r=0;r<this.rows;r++) for(let c=0;c<this.cols;c++){
      const cell=el('div','');
      const v=this.grid[r][c];
      const color = v===1?'#FBBF24':v===2?'#EF4444':'rgba(10,22,51,.7)';
      cell.style.cssText=`width:42px;height:42px;border-radius:50%;background:${color};cursor:${r===0&&!this.done?'pointer':'default'};box-shadow:inset 0 -2px 4px rgba(0,0,0,.3)`;
      if(r===0 && !this.done) cell.onclick=()=>this.drop(c);
      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
    if(!this.done){
      const colBtns=el('div',''); colBtns.style.cssText='display:grid;grid-template-columns:repeat(7,42px);gap:3px;padding:0 6px';
      for(let c=0;c<this.cols;c++){
        const b=el('button','',this.turn===1?'⬇':' ');
        b.style.cssText='width:42px;height:24px;background:rgba(245,158,11,.2);border:1px solid rgba(245,158,11,.4);border-radius:6px;color:var(--gold-bright);cursor:pointer;font-size:14px';
        if(this.turn===1) b.onclick=()=>this.drop(c);
        colBtns.appendChild(b);
      }
      wrap.appendChild(colBtns);
    }
    area.appendChild(wrap);
  },
  end(){
    const won = this.winner===1;
    const r = won?{coin:80,brain:5}:this.winner===0?{coin:30}:{coin:15};
    recordResult('logic','dropfour',won,r);
    setTimeout(()=>{
      if(won) Modal.win({rewards:r,title:'🟡 4 in a row!',emoji:'🏆',retry:()=>DropFourGame.start(),lobby:()=>App.toLobby()});
      else if(this.winner===2) Modal.lose({title:'CPU got 4',msg:'block earlier next time!',retry:()=>DropFourGame.start(),lobby:()=>App.toLobby()});
      else Modal.lose({title:'Draw',msg:'no winner this round',retry:()=>DropFourGame.start(),lobby:()=>App.toLobby()});
    },500);
  },
  cleanup(){}
};

const SeaBattleGame = {
  start(){
    State.gameInst=this;
    this.size=5;
    this.grid=Array.from({length:this.size},()=>Array(this.size).fill(0));
    this.revealed=Array.from({length:this.size},()=>Array(this.size).fill(false));
    // Place 4 ships (each 1 cell · simpler)
    let placed=0;
    while(placed<4){
      const r=Math.floor(Math.random()*this.size), c=Math.floor(Math.random()*this.size);
      if(this.grid[r][c]===0){ this.grid[r][c]=1; placed++; }
    }
    this.shipsLeft=4;
    this.shots=0;
    this.maxShots=15;
    this.render();
    UI.show('game');
  },
  tap(r,c){
    if(this.revealed[r][c] || this.shots>=this.maxShots) return;
    this.revealed[r][c]=true;
    this.shots++;
    if(this.grid[r][c]===1){
      this.shipsLeft--;
      SFX.correct(); haptic(20);
      Toast.show('🚢 HIT!');
    }else{
      SFX.wrong(); haptic(10);
    }
    this.render();
    if(this.shipsLeft<=0 || this.shots>=this.maxShots){ setTimeout(()=>this.end(),500); }
  },
  render(){
    document.getElementById('g-stats').innerHTML=`<b>🚢 Sea Battle</b> · ships left: <b>${this.shipsLeft}/4</b> · shots: <b>${this.shots}/${this.maxShots}</b>`;
    const area=document.getElementById('g-area'); area.innerHTML='';
    const wrap=el('div','stroop-area');
    wrap.appendChild(el('div','dim','find 4 hidden ships in 15 shots'));
    const grid=el('div','');
    grid.style.cssText='display:grid;grid-template-columns:repeat(5,52px);gap:4px;background:rgba(34,211,238,.2);padding:6px;border-radius:14px;margin:14px 0';
    for(let r=0;r<this.size;r++) for(let c=0;c<this.size;c++){
      const cell=el('div','');
      const rev=this.revealed[r][c];
      const hit=rev && this.grid[r][c]===1;
      const miss=rev && this.grid[r][c]===0;
      cell.style.cssText=`width:52px;height:52px;border-radius:8px;background:${hit?'#EF4444':miss?'rgba(255,255,255,.15)':'rgba(34,211,238,.4)'};display:grid;place-items:center;cursor:${rev?'default':'pointer'};font-size:24px;border:1px solid ${hit?'#FBBF24':'rgba(255,255,255,.2)'}`;
      cell.textContent = hit?'💥':miss?'·':'';
      if(!rev) cell.onclick=()=>this.tap(r,c);
      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
    area.appendChild(wrap);
  },
  end(){
    const won = this.shipsLeft<=0;
    const r=won?{coin:80+(this.maxShots-this.shots)*10,brain:4}:{coin:Math.max(15,(4-this.shipsLeft)*15)};
    recordResult('mind','seabattle',won,r);
    if(won) Modal.win({rewards:r,title:`All 4 sunk in ${this.shots} shots!`,emoji:'🚢',retry:()=>SeaBattleGame.start(),lobby:()=>App.toLobby()});
    else Modal.lose({title:`${4-this.shipsLeft}/4 sunk`,msg:'all 4 for the win!',retry:()=>SeaBattleGame.start(),lobby:()=>App.toLobby()});
  },
  cleanup(){}
};

// 🎮 GAME 40 · DOTS & BOXES 3×3 (Logic Lab) · vs CPU
// ====================================================================
const DotsBoxesGame = {
  start(){
    State.gameInst=this;
    this.size=3; // 3x3 dots = 2x2 box grid
    // Lines: horizontal[row][col] for row 0..2, col 0..1; vertical[row][col] row 0..1, col 0..2
    this.hLines = Array.from({length:this.size},()=>Array(this.size-1).fill(0));
    this.vLines = Array.from({length:this.size-1},()=>Array(this.size).fill(0));
    this.boxes = Array.from({length:this.size-1},()=>Array(this.size-1).fill(0));
    this.turn=1; this.scoreYou=0; this.scoreCPU=0; this.done=false;
    this.render();
    UI.show('game');
  },
  drawH(r,c){ if(this.done||this.turn!==1||this.hLines[r][c])return; this._draw('h',r,c); },
  drawV(r,c){ if(this.done||this.turn!==1||this.vLines[r][c])return; this._draw('v',r,c); },
  _draw(type,r,c){
    if(type==='h') this.hLines[r][c]=this.turn;
    else this.vLines[r][c]=this.turn;
    SFX.tap(); haptic(5);
    const completed = this._checkBoxes(this.turn);
    if(!completed){ this.turn = this.turn===1?2:1; }
    this.render();
    if(this._allDrawn()){ this.done=true; this.end(); return; }
    if(this.turn===2){ setTimeout(()=>this._cpuMove(),700); }
  },
  _checkBoxes(player){
    let completed=false;
    for(let r=0;r<this.size-1;r++) for(let c=0;c<this.size-1;c++){
      if(this.boxes[r][c]) continue;
      const top=this.hLines[r][c], bot=this.hLines[r+1][c];
      const lef=this.vLines[r][c], rig=this.vLines[r][c+1];
      if(top && bot && lef && rig){
        this.boxes[r][c]=player;
        if(player===1) this.scoreYou++; else this.scoreCPU++;
        completed=true;
      }
    }
    return completed;
  },
  _cpuMove(){
    if(this.done) return;
    // CPU finds safe line OR completes a box if possible
    const moves=[];
    for(let r=0;r<this.size;r++) for(let c=0;c<this.size-1;c++) if(!this.hLines[r][c]) moves.push({t:'h',r,c});
    for(let r=0;r<this.size-1;r++) for(let c=0;c<this.size;c++) if(!this.vLines[r][c]) moves.push({t:'v',r,c});
    if(moves.length===0) return;
    // Try to complete a box
    let best=null;
    for(const m of moves){
      if(m.t==='h') this.hLines[m.r][m.c]=2; else this.vLines[m.r][m.c]=2;
      const completedCount = this._countWouldComplete(2);
      if(m.t==='h') this.hLines[m.r][m.c]=0; else this.vLines[m.r][m.c]=0;
      if(completedCount>0){ best=m; break; }
    }
    if(!best) best=moves[Math.floor(Math.random()*moves.length)];
    if(best.t==='h') this.hLines[best.r][best.c]=2; else this.vLines[best.r][best.c]=2;
    SFX.tap();
    const completed = this._checkBoxes(2);
    if(!completed){ this.turn=1; }
    this.render();
    if(this._allDrawn()){ this.done=true; this.end(); return; }
    if(this.turn===2 && !this.done){ setTimeout(()=>this._cpuMove(),700); }
  },
  _countWouldComplete(player){
    let count=0;
    for(let r=0;r<this.size-1;r++) for(let c=0;c<this.size-1;c++){
      if(this.boxes[r][c]) continue;
      const top=this.hLines[r][c], bot=this.hLines[r+1][c];
      const lef=this.vLines[r][c], rig=this.vLines[r][c+1];
      if(top && bot && lef && rig) count++;
    }
    return count;
  },
  _allDrawn(){
    for(const row of this.hLines) for(const v of row) if(!v) return false;
    for(const row of this.vLines) for(const v of row) if(!v) return false;
    return true;
  },
  render(){
    document.getElementById('g-stats').innerHTML=`<b>📦 Dots & Boxes</b> · you: <b>${this.scoreYou}</b> · CPU: <b>${this.scoreCPU}</b> · ${this.turn===1?'your turn':'CPU thinking...'}`;
    const area=document.getElementById('g-area'); area.innerHTML='';
    const wrap=el('div','stroop-area');
    wrap.appendChild(el('div','dim','click line · complete box = extra turn'));
    const board=el('div',''); board.style.cssText='display:inline-block;padding:20px;background:rgba(255,255,255,.04);border-radius:14px;margin:14px 0';
    // Build SVG-like grid using positioned divs
    const cellSize=60;
    const total=cellSize*(this.size-1);
    const svg=el('div',''); svg.style.cssText=`position:relative;width:${total}px;height:${total}px`;
    // Boxes background
    for(let r=0;r<this.size-1;r++) for(let c=0;c<this.size-1;c++){
      const b=el('div','');
      const owner=this.boxes[r][c];
      b.style.cssText=`position:absolute;left:${c*cellSize}px;top:${r*cellSize}px;width:${cellSize}px;height:${cellSize}px;background:${owner===1?'rgba(245,158,11,.3)':owner===2?'rgba(239,68,68,.3)':'transparent'};display:grid;place-items:center;color:#fff;font-weight:800`;
      b.textContent = owner===1?'Y':owner===2?'C':'';
      svg.appendChild(b);
    }
    // H lines
    for(let r=0;r<this.size;r++) for(let c=0;c<this.size-1;c++){
      const line=el('div','');
      const drawn=this.hLines[r][c];
      line.style.cssText=`position:absolute;left:${c*cellSize+4}px;top:${r*cellSize-2}px;width:${cellSize-8}px;height:6px;background:${drawn?(drawn===1?'#FBBF24':'#EF4444'):'rgba(255,255,255,.15)'};border-radius:3px;cursor:${drawn?'default':'pointer'}`;
      if(!drawn && this.turn===1) line.onclick=()=>this.drawH(r,c);
      svg.appendChild(line);
    }
    // V lines
    for(let r=0;r<this.size-1;r++) for(let c=0;c<this.size;c++){
      const line=el('div','');
      const drawn=this.vLines[r][c];
      line.style.cssText=`position:absolute;left:${c*cellSize-2}px;top:${r*cellSize+4}px;width:6px;height:${cellSize-8}px;background:${drawn?(drawn===1?'#FBBF24':'#EF4444'):'rgba(255,255,255,.15)'};border-radius:3px;cursor:${drawn?'default':'pointer'}`;
      if(!drawn && this.turn===1) line.onclick=()=>this.drawV(r,c);
      svg.appendChild(line);
    }
    // Dots
    for(let r=0;r<this.size;r++) for(let c=0;c<this.size;c++){
      const dot=el('div','');
      dot.style.cssText=`position:absolute;left:${c*cellSize-5}px;top:${r*cellSize-5}px;width:10px;height:10px;border-radius:50%;background:#FBBF24`;
      svg.appendChild(dot);
    }
    board.appendChild(svg);
    wrap.appendChild(board);
    area.appendChild(wrap);
  },
  end(){
    const won=this.scoreYou>this.scoreCPU;
    const tie=this.scoreYou===this.scoreCPU;
    const r=won?{coin:70+this.scoreYou*10,brain:4}:tie?{coin:30}:{coin:15};
    recordResult('logic','dotsboxes',won,r);
    setTimeout(()=>{
      if(won) Modal.win({rewards:r,title:`${this.scoreYou}-${this.scoreCPU} · YOU WIN!`,emoji:'📦',retry:()=>DotsBoxesGame.start(),lobby:()=>App.toLobby()});
      else if(tie) Modal.lose({title:`${this.scoreYou}-${this.scoreCPU} · TIE`,msg:'draw · play again!',retry:()=>DotsBoxesGame.start(),lobby:()=>App.toLobby()});
      else Modal.lose({title:`${this.scoreYou}-${this.scoreCPU} · CPU wins`,msg:'capture more boxes!',retry:()=>DotsBoxesGame.start(),lobby:()=>App.toLobby()});
    },500);
  },
  cleanup(){}
};

const DailyGame = {
  start(){
    const day = Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/86400000);
    const games = [WordleGame, MemoryGame, StroopGame, MathGame, VerseGame, AnagramGame, SimonGame, ReactionGame, SequenceGame, BooksGame, LightsGame, SpotGame, HuntGame, ColorMatchGame, WhackGame, CodeSprintGame, TriviaGame, DefineGame, NumberTapGame, HangmanGame, RiddleGame, SudokuGame, ParableGame];

    const names = ['📖 5-Letter','🧠 Memory','🎯 Stroop','🔢 Math','✝️ Verse','📜 Anagram','🎼 Simon','⚡ Reaction','🧮 Sequence','📖 Books','💡 Lights','🔍 Spot','🔢 Hunt','🎨 Color','🌟 Whack','🔑 Code','🧠 Trivia','📚 Define','🔢 Tap','🪢 Hangman','🦉 Riddle','🧩 Sudoku','🕊️ Parable'];
    Toast.show(`🎲 today's spotlight: <b>${names[pickIdx]}</b> · 2x rewards!`);
    State._dailyMultiplier = 2;
    setTimeout(()=>pick.start(), 800);
  }
};

// v0.32 UNLOCK AUDIO on first user interaction (browsers block autoplay)
let _audioUnlocked = false;
function _unlockAudio(){
  if(_audioUnlocked) return;
  _audioUnlocked = true;
  // Re-trigger current music
  const activeScreen = document.querySelector('.screen.active')?.id;
  if(activeScreen && State.data?.settings?.music!==false){
    let track = activeScreen;
    if((activeScreen==='room'||activeScreen==='game') && State.currentRoom) track = State.currentRoom;
    Music.play(track);
  }
}
['click','touchstart','keydown'].forEach(e=>{
  document.addEventListener(e, _unlockAudio, {once:false, passive:true});
});

// v0.31 IDLE PAUSE · stops music after 5 min no input (saves CPU + battery)
let _idleTimer = null;
let _idleMs = 5*60*1000; // 5 min
function _resetIdle(){
  if(_idleTimer) clearTimeout(_idleTimer);
  _idleTimer = setTimeout(()=>{
    Music.stop();
    Toast.show('🌙 idle · music paused · tap to resume');
  }, _idleMs);
}
['click','touchstart','keydown','mousemove','scroll'].forEach(e=>{
  document.addEventListener(e, _resetIdle, {passive:true});
});
_resetIdle();

// v0.31 ANTI-FREEZE · global cleanup on screen change
// Catches any orphan intervals from older game instances
const _trackedTimers = new Set();
const _origSetInterval = window.setInterval;
const _origClearInterval = window.clearInterval;
window.setInterval = function(fn,ms,...args){
  const id = _origSetInterval(fn,ms,...args);
  _trackedTimers.add(id);
  return id;
};
window.clearInterval = function(id){
  _trackedTimers.delete(id);
  return _origClearInterval(id);
};
function _purgeOrphanTimers(){
  // Only call when no game is active · clean orphans
  if(!State.gameInst && _trackedTimers.size>6){
    _trackedTimers.forEach(id=>{
      try{_origClearInterval(id);}catch{}
    });
    _trackedTimers.clear();
  }
}
// Run purge every 30s when idle
setInterval(_purgeOrphanTimers, 30000);

// v0.15 PWA service worker registration (only when served via http(s), not file://)
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW register failed:', err));
  });
}

// v0.15 PWA install prompt capture
window._deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  window._deferredPrompt = e;
});

// v0.13/v0.18 LIVE CLOCK · refreshes every 30 sec across visible screens
function _refreshLiveClock(){
  if(!State.data) return;
  const now = new Date();
  const t = now.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const lc = document.getElementById('lobby-clock');
  if(lc) lc.textContent = '⏱ '+t;
  // Refresh splash greeting if visible (handles new minute/hour boundary)
  if(document.getElementById('splash')?.classList.contains('active')){
    App.renderSplashPersonal();
  }
}
setInterval(_refreshLiveClock, 30000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && State.data){
    _refreshLiveClock();
  }
});
// also tick every minute boundary precisely
function _tickToNextMinute(){
  const now = new Date();
  const msToNext = (60-now.getSeconds())*1000 - now.getMilliseconds();
  setTimeout(()=>{ _refreshLiveClock(); _tickToNextMinute(); }, msToNext);
}
_tickToNextMinute();
function _showFatal(e){
  const msg = (e && (e.message||String(e)))||'unknown error';
  const stack = (e && e.stack)||'';
  const html = '<div style="position:fixed;inset:0;background:#1E3A8A;color:#FFF8E7;padding:24px;font-family:monospace;overflow:auto;z-index:9999"><h2 style="color:#FBBF24;font-size:18px;margin-bottom:12px;font-family:serif">⚠️ BrainBoard error</h2><pre style="white-space:pre-wrap;font-size:13px;background:#0a1633;padding:14px;border-radius:8px;border:1px solid #F59E0B">'+msg+'\n\n'+stack+'</pre><div style="margin-top:14px;padding:14px;background:#0a1633;border-radius:8px"><b>Try:</b><br>1. tap below to clear save<br>2. then refresh</div><button onclick="try{localStorage.clear()}catch(e){};location.reload()" style="margin-top:14px;padding:14px 24px;background:#FBBF24;color:#0F172A;border:none;border-radius:99px;font-weight:800;font-size:15px;cursor:pointer">🗑️ CLEAR + RELOAD</button></div>';
  const div = document.createElement('div');
  div.innerHTML = html;
  document.body.appendChild(div);
}
window.addEventListener('error',(ev)=>_showFatal(ev.error||{message:ev.message,stack:''}));
let _initRan = false;
function _bootOnce(){
  if(_initRan) return;
  _initRan = true;
  try{ App.init(); }catch(e){
    console.error('BrainBoard boot fail',e);
    _showFatal(e);
  }
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', _bootOnce);
}else{
  _bootOnce();
}
// safety: also bind to window load as a last-ditch trigger
window.addEventListener('load', _bootOnce);
</script>
