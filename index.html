<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1E3A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BrainBoard">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E3A8A'/%3E%3Ctext y='48' x='32' text-anchor='middle' font-size='40'%3E🧠%3C/text%3E%3C/svg%3E">
<title>🧠 BrainBoard · sharpen the mind · feed the spirit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cobalt:#1E3A8A;
  --cobalt-light:#3B5BD9;
  --purple:#7C3AED;
  --purple-deep:#5B21B6;
  --gold:#F59E0B;
  --gold-bright:#FBBF24;
  --cream:#FFF8E7;
  --white-holy:#FFFFFF;
  --ink:#0F172A;
  --parchment:#F5E6C8;
  --neural:#22D3EE;
  --crystal:#A855F7;
  --slate:#475569;
  --manna:#FCD34D;
  --good:#10B981;
  --bad:#EF4444;
  --warn:#F59E0B;
  --shadow:0 10px 30px rgba(15,23,42,.45);
  --glow-gold:0 0 24px rgba(245,158,11,.55);
  --glow-holy:0 0 36px rgba(255,255,255,.55);
  --r-sm:8px; --r-md:14px; --r-lg:22px; --r-xl:32px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;min-height:100vh;
  font-family:'Inter',system-ui,sans-serif;
  color:var(--cream);
  background:radial-gradient(ellipse at top,var(--cobalt-light) 0%,var(--cobalt) 40%,#0a1633 100%);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
/* v0.20 large-text + color-blind safe modes */
body.large-text{font-size:118%}
body.color-blind .room-mind,
body.color-blind .room-script{filter:hue-rotate(20deg)}
body.color-blind .word-cell.green{background:#0066CC !important}
body.color-blind .word-cell.yellow{background:#FFC107 !important}

/* v0.29 SCROLL EVERYWHERE · every screen body scrolls, headers stick */
.lobby-content, #aux-body, .room-body, .game-area{
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
#splash{ overflow-y:auto; }
#onboard{ overflow-y:auto; }
.modal-card{ max-height:90vh; overflow-y:auto; }

/* v0.23 PRO POLISH · consistent micro-anims · mobile-tight */
@media (max-width:540px){
  .lobby-foot{ grid-template-columns:repeat(3,1fr) !important; }
  .lobby-foot .foot-btn{ font-size:10px; padding:10px 4px; }
  .lobby-foot .foot-btn .em{ font-size:18px; }
  .hud{ padding:8px 10px; }
  .hud-row{ gap:6px; flex-wrap:wrap; }
  .wallet-chip{ padding:4px 7px; font-size:11px; }
  .mini-chip{ font-size:9px; padding:2px 5px; }
  .lobby-content{ padding:12px; gap:10px; }
  .room-door{ padding:14px 12px; min-height:100px; }
  .room-door .em{ font-size:28px; }
  .room-door .name{ font-size:14px; }
  .room-door .sub{ font-size:10px; }
  .modal-card{ padding:18px 14px; }
  .modal-card h3{ font-size:18px; }
  .stats-grid{ grid-template-columns:1fr 1fr !important; }
  .game-card{ padding:12px; }
  .game-card .em{ font-size:34px; }
  .splash-emoji{ font-size:64px !important; }
  .splash-title{ font-size:42px !important; }
  .splash-tagline{ font-size:13px !important; margin-bottom:24px !important; }
  .splash-cta{ padding:14px 28px; font-size:15px; }
}
@media (max-width:380px){
  .lobby-foot{ grid-template-columns:repeat(3,1fr) !important; }
  .room-door{ min-height:88px; }
  .splash-title{ font-size:36px !important; }
  .splash-emoji{ font-size:54px !important; }
}
/* v0.23 lift + smoothness on interactive elements */
.room-door,.foot-btn,.game-card,.btn-primary,.btn-secondary{
  transition:transform .15s cubic-bezier(.34,1.5,.64,1), box-shadow .15s, opacity .15s;
}
.room-door:hover,.game-card:hover{transform:translateY(-2px)}
.btn-primary:hover{box-shadow:var(--glow-gold),0 12px 28px rgba(0,0,0,.4)}
/* v0.23 scrollbar polish */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(245,158,11,.3);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(245,158,11,.5)}
body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  min-height:100dvh;
}
h1,h2,h3{font-family:'Cinzel',serif;letter-spacing:.02em}
button{
  font-family:'Inter',sans-serif;
  cursor:pointer;border:none;
  -webkit-appearance:none;appearance:none;
}

/* ==================== SCREEN SYSTEM ==================== */
.screen{
  position:fixed;
  top:0;right:0;bottom:0;left:0;
  display:none !important;
  flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  opacity:1;
  z-index:1;
}
.screen.active{display:flex !important;opacity:1 !important;z-index:2}
.screen.fade-in{animation:screenIn .35s ease forwards}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ==================== SPLASH ==================== */
#splash{
  background:
    radial-gradient(circle at 30% 20%,rgba(124,58,237,.4) 0%,transparent 60%),
    radial-gradient(circle at 70% 80%,rgba(245,158,11,.3) 0%,transparent 50%),
    linear-gradient(180deg,var(--cobalt) 0%,#0a1633 100%);
  align-items:center;justify-content:center;
  text-align:center;
  overflow-y:auto;
  padding:40px 20px 80px;
}
.splash-emoji{
  font-size:96px;
  filter:drop-shadow(0 0 24px rgba(255,255,255,.4));
  animation:floatBob 3s ease-in-out infinite;
  margin-bottom:8px;
}
@keyframes floatBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.splash-title{
  font-family:'Cinzel',serif;
  font-size:clamp(40px,9vw,72px);
  font-weight:900;
  color:var(--gold-bright);
  -webkit-text-stroke:1px var(--white-holy);
  text-shadow:
    0 0 24px rgba(245,158,11,.65),
    0 4px 18px rgba(15,23,42,.8),
    0 0 60px rgba(255,248,231,.2);
  letter-spacing:.06em;
  margin-bottom:14px;
  animation:titlePulse 4s ease-in-out infinite;
}
@keyframes titlePulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}
.splash-tagline{
  font-style:italic;font-size:clamp(14px,3.5vw,18px);
  color:var(--cream);opacity:.85;
  margin-bottom:48px;letter-spacing:.05em;
}
.splash-cta{
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-bright) 100%);
  color:var(--ink);font-weight:800;
  padding:18px 44px;border-radius:99px;
  font-size:18px;letter-spacing:.05em;
  box-shadow:var(--glow-gold),0 8px 24px rgba(0,0,0,.35);
  animation:ctaPulse 2s ease-in-out infinite;
}
@keyframes ctaPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.splash-foot{
  font-size:11px;opacity:.6;letter-spacing:.1em;
  margin-top:18px;
}

/* ==================== ONBOARDING ==================== */
#onboard{
  background:linear-gradient(180deg,var(--cobalt) 0%,var(--purple-deep) 100%);
  align-items:center;
  padding:24px 16px;
  overflow-y:auto;
}
.onboard-card{
  width:100%;max-width:440px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:var(--r-xl);
  padding:24px 18px;
  backdrop-filter:blur(12px);
  text-align:center;
  margin:auto;
}
.onboard-card h2{
  font-size:22px;color:var(--gold-bright);margin-bottom:8px;
}
.onboard-card p{font-size:14px;opacity:.85;margin-bottom:22px}
.mood-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;
}
.mood-btn{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  border-radius:var(--r-md);
  padding:18px 12px;
  color:var(--cream);
  font-size:15px;font-weight:600;
  transition:all .2s;
}
.mood-btn:active{transform:scale(.96)}
.mood-btn .em{display:block;font-size:32px;margin-bottom:6px}
.mood-btn.sel{
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-bright) 100%);
  color:var(--ink);
  box-shadow:var(--glow-gold);
}
.preset-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;
}
.preset-btn{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  border-radius:var(--r-md);
  padding:16px 4px;color:var(--cream);
  font-size:11px;font-weight:600;
}
.preset-btn .em{display:block;font-size:32px;margin-bottom:4px}
.preset-btn.sel{
  background:linear-gradient(135deg,var(--purple) 0%,var(--crystal) 100%);
  box-shadow:0 0 18px rgba(168,85,247,.5);
}
.name-input{
  width:100%;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  border-radius:var(--r-md);
  padding:14px;color:var(--cream);
  font-size:16px;font-family:inherit;
  margin-bottom:16px;text-align:center;
}
.name-input:focus{
  outline:none;
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(245,158,11,.2);
}
.btn-primary{
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-bright) 100%);
  color:var(--ink);font-weight:800;
  padding:14px 28px;border-radius:99px;
  font-size:15px;letter-spacing:.05em;
  width:100%;
  box-shadow:var(--glow-gold);
}
.btn-primary:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn-secondary{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  color:var(--cream);
  padding:12px 20px;border-radius:99px;
  font-size:14px;font-weight:600;
}

/* ==================== LOBBY ==================== */
#lobby{
  background:
    radial-gradient(circle at 50% 30%,rgba(124,58,237,.25) 0%,transparent 60%),
    linear-gradient(180deg,var(--cobalt) 0%,#0a1633 100%);
  overflow-y:auto;
}
.hud{
  position:sticky;top:0;z-index:50;
  background:rgba(10,22,51,.85);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:10px 14px;
  display:flex;flex-direction:column;gap:6px;
}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wallet{
  display:flex;gap:8px;flex-wrap:wrap;
  font-size:12px;font-weight:700;
}
.wallet-chip{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  padding:5px 9px;border-radius:99px;
  display:flex;align-items:center;gap:4px;
  font-variant-numeric:tabular-nums;
}
.profile-tag{
  display:flex;align-items:center;gap:6px;
  background:rgba(245,158,11,.15);
  padding:4px 10px;border-radius:99px;
  border:1px solid rgba(245,158,11,.3);
  font-size:12px;font-weight:700;
}
.icon-btn{
  width:36px;height:36px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:50%;
  font-size:16px;
  display:grid;place-items:center;
  color:var(--cream);
}
.lobby-content{
  flex:1;padding:16px;
  display:flex;flex-direction:column;gap:14px;
}
.lobby-banner{
  background:linear-gradient(135deg,rgba(124,58,237,.3) 0%,rgba(245,158,11,.2) 100%);
  border:1px solid rgba(245,158,11,.3);
  border-radius:var(--r-lg);
  padding:14px 16px;
  text-align:center;
  font-size:13px;
}
.lobby-banner b{color:var(--gold-bright)}
.lobby-title{
  text-align:center;
  font-family:'Cinzel',serif;
  font-size:22px;color:var(--gold-bright);
  letter-spacing:.06em;
  margin:8px 0 4px;
}
.rooms-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.room-door{
  position:relative;overflow:hidden;
  border-radius:var(--r-lg);
  padding:18px 14px;
  min-height:120px;
  display:flex;flex-direction:column;justify-content:space-between;
  border:1px solid rgba(255,255,255,.14);
  cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  text-align:left;color:var(--cream);
}
.room-door:active{transform:scale(.97)}
.room-door .em{font-size:36px;margin-bottom:6px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.room-door .name{font-family:'Cinzel',serif;font-size:16px;font-weight:700;letter-spacing:.04em}
.room-door .sub{font-size:11px;opacity:.75;margin-top:2px}
.room-word{background:linear-gradient(135deg,#8B6914 0%,#5A4308 100%)}
.room-brain{background:linear-gradient(135deg,#1E40AF 0%,#172554 100%)}
.room-mind{background:linear-gradient(135deg,#7C3AED 0%,#3B0764 100%)}
.room-num{background:linear-gradient(135deg,#0E7490 0%,#0C4A6E 100%)}
.room-script{
  background:linear-gradient(135deg,#B45309 0%,#7C2D12 50%,#4C1D95 100%);
  box-shadow:inset 0 0 24px rgba(255,248,231,.15);
}
.room-logic{background:linear-gradient(135deg,#0E7490 0%,#581C87 100%)}
.room-speed{background:linear-gradient(135deg,#DC2626 0%,#7C2D12 100%)}
.room-daily{background:linear-gradient(135deg,#10B981 0%,#064E3B 100%)}
.lobby-foot{
  display:grid;grid-template-columns:repeat(6,1fr);gap:5px;
  margin-top:8px;
}
.foot-btn{font-size:10px}
.foot-btn .em{font-size:20px}
.foot-btn{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:var(--r-md);
  padding:14px 6px;
  color:var(--cream);
  font-size:11px;font-weight:600;
  text-align:center;
}
.foot-btn .em{display:block;font-size:22px;margin-bottom:2px}

/* ==================== ROOM SCREEN ==================== */
.room-screen{
  background:linear-gradient(180deg,var(--cobalt) 0%,#0a1633 100%);
  overflow-y:auto;
}
.room-header{
  position:sticky;top:0;z-index:30;
  background:rgba(10,22,51,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:10px 12px;
  display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;
}
.mini-wallet{
  display:flex;gap:4px;flex-wrap:wrap;
  font-size:10px;font-weight:700;
}
.mini-chip{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  padding:3px 7px;border-radius:99px;
  display:inline-flex;align-items:center;gap:3px;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.mini-chip.gold{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4);color:var(--gold-bright)}
.mini-chip.faith{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3)}
.back-btn{
  width:36px;height:36px;
  background:rgba(255,255,255,.08);
  border-radius:50%;
  font-size:18px;
  display:grid;place-items:center;
  color:var(--cream);border:none;
}
.room-title-block{flex:1}
.room-title-block h2{font-size:18px;color:var(--gold-bright);font-weight:700}
.room-title-block .sub{font-size:11px;opacity:.7}
.room-body{
  flex:1;padding:14px;
  display:flex;flex-direction:column;gap:12px;
}
.game-card{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:var(--r-lg);
  padding:16px;
  display:flex;align-items:center;gap:14px;
  cursor:pointer;
  transition:all .2s;
}
.game-card:active{transform:scale(.98)}
.game-card .em{font-size:42px;flex-shrink:0}
.game-card .info{flex:1}
.game-card .info h3{font-size:15px;color:var(--cream);font-weight:700;margin-bottom:2px}
.game-card .info .sub{font-size:11px;opacity:.7;line-height:1.4}
.game-card .stat{
  font-size:11px;font-weight:700;
  background:rgba(245,158,11,.18);
  color:var(--gold-bright);
  padding:4px 8px;border-radius:99px;
}

/* ==================== GAME UI ==================== */
.game-screen{
  background:linear-gradient(180deg,var(--cobalt) 0%,#0a1633 100%);
  overflow:hidden;
}
.game-header{
  padding:10px 14px;
  background:rgba(10,22,51,.95);
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}
.game-stats{flex:1;font-size:11px;opacity:.85}
.game-stats b{color:var(--gold-bright)}
.game-area{
  flex:1;overflow-y:auto;
  padding:18px 14px;
  display:flex;flex-direction:column;
  align-items:center;gap:14px;
}

/* WORDLE */
.word-grid{
  display:grid;
  grid-template-rows:repeat(6,52px);
  gap:6px;margin:8px 0;
}
.word-row{
  display:grid;
  grid-template-columns:repeat(5,52px);
  gap:6px;
}
.word-cell{
  width:52px;height:52px;
  border:2px solid rgba(255,255,255,.18);
  border-radius:var(--r-sm);
  display:grid;place-items:center;
  font-family:'Cinzel',serif;
  font-size:24px;font-weight:700;
  text-transform:uppercase;
  background:rgba(255,255,255,.04);
  transition:all .3s;
}
.word-cell.filled{border-color:var(--cream)}
.word-cell.green{background:var(--good);border-color:var(--good);color:#fff}
.word-cell.yellow{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.word-cell.gray{background:var(--slate);border-color:var(--slate);color:#fff}
.word-keyboard{
  width:100%;max-width:420px;
  display:flex;flex-direction:column;gap:6px;
  margin-top:8px;
}
.word-keyrow{display:flex;justify-content:center;gap:4px}
.word-key{
  flex:1;min-width:24px;max-width:36px;
  height:46px;
  background:rgba(255,255,255,.12);
  border-radius:var(--r-sm);
  font-weight:700;font-size:13px;
  color:var(--cream);
  display:grid;place-items:center;
}
.word-key.wide{max-width:60px;font-size:11px}
.word-key.green{background:var(--good)}
.word-key.yellow{background:var(--gold);color:var(--ink)}
.word-key.gray{background:var(--slate);opacity:.5}

/* MEMORY MATCH */
.mem-grid{
  display:grid;gap:8px;
  width:100%;max-width:340px;
}
.mem-card{
  aspect-ratio:1;
  background:linear-gradient(135deg,var(--purple) 0%,var(--cobalt) 100%);
  border:2px solid rgba(255,255,255,.15);
  border-radius:var(--r-md);
  display:grid;place-items:center;
  font-size:28px;
  cursor:pointer;
  transition:transform .25s;
  transform-style:preserve-3d;
}
.mem-card.flipped{
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-bright) 100%);
  transform:rotateY(180deg);
}
.mem-card.flipped .face{transform:rotateY(180deg)}
.mem-card.matched{
  background:linear-gradient(135deg,var(--good) 0%,#0E9F6E 100%);
  cursor:default;animation:pop .35s;
}
@keyframes pop{50%{transform:scale(1.12)}}
.mem-card .face{display:none}
.mem-card.flipped .face,.mem-card.matched .face{display:block}

/* STROOP */
.stroop-area{
  display:flex;flex-direction:column;align-items:center;
  width:100%;gap:18px;
}
.stroop-word{
  font-family:'Cinzel',serif;
  font-size:64px;font-weight:900;
  margin:24px 0;
  text-shadow:0 4px 12px rgba(0,0,0,.5);
  animation:stroopPop .3s;
}
@keyframes stroopPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.stroop-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  width:100%;max-width:320px;
}
.stroop-btn{
  padding:18px;border-radius:var(--r-md);
  font-weight:800;font-size:15px;
  color:#fff;
  border:2px solid rgba(255,255,255,.2);
  text-transform:uppercase;
  letter-spacing:.05em;
}
.stroop-btn:active{transform:scale(.96)}

/* MATH SPRINT */
.math-q{
  font-family:'Cinzel',serif;
  font-size:48px;font-weight:700;
  margin:24px 0 12px;
  text-align:center;
  color:var(--gold-bright);
}
.math-input{
  width:100%;max-width:200px;
  background:rgba(255,255,255,.1);
  border:2px solid var(--gold);
  border-radius:var(--r-md);
  padding:14px;
  color:var(--cream);
  font-size:24px;font-weight:700;
  text-align:center;font-family:inherit;
}
.math-pad{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;width:100%;max-width:280px;margin-top:12px;
}
.math-key{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r-md);
  padding:18px;
  font-size:22px;font-weight:700;
  color:var(--cream);
}
.math-key.go{background:var(--good);grid-column:span 2}
.math-key.del{background:var(--bad)}

/* VERSE FILL-IN */
.verse-card{
  width:100%;max-width:480px;
  background:linear-gradient(135deg,rgba(180,83,9,.25) 0%,rgba(76,29,149,.25) 100%);
  border:1px solid rgba(245,158,11,.3);
  border-radius:var(--r-lg);
  padding:24px 18px;
  text-align:center;
  font-size:18px;line-height:1.7;
  color:var(--cream);
  font-family:'Cinzel',serif;
  font-weight:500;
  position:relative;
}
.verse-blank{
  display:inline-block;
  min-width:80px;
  border-bottom:2px solid var(--gold);
  margin:0 4px;padding:0 6px;
  color:var(--gold-bright);font-weight:700;
}
.verse-blank.filled{color:var(--good)}
.verse-ref{
  display:block;margin-top:12px;
  font-size:13px;color:var(--gold);font-style:italic;
}
.verse-options{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;width:100%;max-width:420px;
}
.verse-opt{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r-md);
  padding:14px;
  color:var(--cream);font-weight:600;
  font-family:'Cinzel',serif;
}
.verse-opt:active{transform:scale(.96)}

/* DAILY COURT */
.daily-card{
  width:100%;max-width:420px;
  background:linear-gradient(135deg,rgba(16,185,129,.3) 0%,rgba(245,158,11,.2) 100%);
  border:1px solid rgba(16,185,129,.4);
  border-radius:var(--r-lg);
  padding:22px 18px;text-align:center;
}
.daily-card .em{font-size:64px;margin-bottom:8px}
.daily-card h3{font-family:'Cinzel',serif;font-size:22px;color:var(--gold-bright);margin-bottom:6px}
.daily-card p{font-size:13px;opacity:.85;margin-bottom:18px}

/* ==================== TOAST ==================== */
.toast-stack{
  position:fixed;top:80px;left:50%;
  transform:translateX(-50%);
  z-index:200;
  display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
  width:90%;max-width:340px;
}
.toast{
  background:rgba(10,22,51,.95);
  border:1px solid rgba(245,158,11,.4);
  backdrop-filter:blur(12px);
  border-radius:var(--r-md);
  padding:12px 16px;
  font-size:13px;font-weight:600;
  color:var(--cream);
  box-shadow:var(--shadow);
  animation:toastIn .35s,toastOut .35s 2.6s forwards;
}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-12px)}}
.toast .ach{color:var(--gold-bright);font-weight:800}

/* ==================== MODAL ==================== */
.modal-bg{
  position:fixed;inset:0;
  background:rgba(10,22,51,.85);
  backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.modal-bg.active{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{
  width:100%;max-width:420px;
  background:linear-gradient(180deg,var(--cobalt-light) 0%,var(--cobalt) 100%);
  border:1px solid rgba(245,158,11,.4);
  border-radius:var(--r-xl);
  padding:24px 20px;
  text-align:center;
  box-shadow:var(--shadow);
  animation:modalIn .35s ease;
}
@keyframes modalIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card .big{font-size:54px;margin-bottom:8px}
.modal-card h3{font-family:'Cinzel',serif;color:var(--gold-bright);font-size:22px;margin-bottom:8px}
.modal-card .verse{
  background:rgba(245,158,11,.1);
  border-left:3px solid var(--gold);
  padding:12px 14px;
  margin:14px 0;
  border-radius:var(--r-sm);
  font-style:italic;font-size:13px;
  text-align:left;
}
.modal-card .verse cite{display:block;color:var(--gold-bright);font-size:11px;margin-top:6px;text-align:right}
.reward-row{
  display:flex;justify-content:center;gap:12px;
  margin:14px 0;flex-wrap:wrap;
}
.reward-chip{
  background:rgba(245,158,11,.2);
  border:1px solid rgba(245,158,11,.4);
  padding:6px 12px;border-radius:99px;
  font-size:13px;font-weight:700;
}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions button{flex:1}

/* SETTINGS / STATS */
.settings-list{
  display:flex;flex-direction:column;gap:10px;
  width:100%;max-width:420px;margin:0 auto;
}
.setting-row{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:var(--r-md);
  padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:14px;
}
.toggle{
  width:44px;height:26px;
  background:rgba(255,255,255,.18);
  border-radius:99px;position:relative;
  cursor:pointer;transition:background .2s;
}
.toggle::after{
  content:'';position:absolute;
  top:2px;left:2px;width:22px;height:22px;
  border-radius:50%;
  background:var(--cream);
  transition:transform .2s;
}
.toggle.on{background:var(--good)}
.toggle.on::after{transform:translateX(18px)}

.stats-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-bottom:14px;
}
.stat-card{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:var(--r-md);
  padding:14px;
  text-align:center;
}
.stat-card .lbl{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.1em}
.stat-card .val{font-family:'Cinzel',serif;font-size:24px;color:var(--gold-bright);font-weight:700;margin-top:4px}
.ach-list{display:flex;flex-direction:column;gap:6px}
.ach-row{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:var(--r-md);
  padding:10px 14px;
  display:flex;align-items:center;gap:10px;
  font-size:13px;
  opacity:.5;
}
.ach-row.unlocked{
  opacity:1;
  background:rgba(245,158,11,.12);
  border-color:rgba(245,158,11,.4);
}
.ach-row .em{font-size:24px}
.ach-row .info{flex:1}
.ach-row .info b{display:block;color:var(--gold-bright);font-size:13px}
.ach-row .info span{font-size:11px;opacity:.75}

/* ==================== UTIL ==================== */
.row-gap-sm{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.text-center{text-align:center}
.dim{opacity:.7;font-size:12px}
@media (max-width:380px){
  .word-cell{width:46px;height:46px;font-size:20px}
  .word-row{grid-template-columns:repeat(5,46px)}
  .word-grid{grid-template-rows:repeat(6,46px)}
  .splash-emoji{font-size:78px}
}

/* ==================== v0.2 CONFETTI · FLAME · SHARE ==================== */
.confetti-piece{
  position:fixed;width:10px;height:10px;
  border-radius:50%;
  pointer-events:none;z-index:300;
  animation:conf 1.5s cubic-bezier(.2,.6,.4,1) forwards;
}
@keyframes conf{
  0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx,0),var(--dy,0)) rotate(540deg) scale(.4)}
}
.flame-streak{
  display:inline-flex;align-items:center;gap:4px;
  animation:flameDance 1.4s ease-in-out infinite;
  font-weight:800;
}
@keyframes flameDance{
  0%,100%{filter:brightness(1) hue-rotate(0deg)}
  50%{filter:brightness(1.2) hue-rotate(15deg)}
}
.share-btn{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  color:var(--cream);
  padding:10px 14px;border-radius:99px;
  font-size:13px;font-weight:600;
  margin-top:8px;
}
.share-btn:active{transform:scale(.96)}
.recent-log{
  display:flex;flex-direction:column;gap:6px;
}
.recent-row{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:var(--r-sm);
  padding:8px 12px;
  font-size:12px;
  display:flex;justify-content:space-between;align-items:center;
}
.recent-row .when{opacity:.6;font-size:11px}
.recent-row.win{border-left:3px solid var(--good)}
.recent-row.loss{border-left:3px solid var(--bad)}
.shake-card{
  animation:shake .35s;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}

/* ==================== v0.3 AVATAR ==================== */
.avatar-stack{
  position:relative;display:inline-flex;
  align-items:center;justify-content:center;
  width:1.4em;height:1.4em;
  vertical-align:middle;
}
.avatar-stack .av-main{
  position:relative;font-size:1em;line-height:1;display:inline-block;
}
.avatar-stack .av-face{
  position:absolute;top:-.05em;right:-.4em;
  font-size:.45em;
}
.avatar-stack .av-hat{
  position:absolute;top:-.55em;left:50%;
  transform:translateX(-50%);
  font-size:.55em;z-index:2;
}
.avatar-stack .av-aura{
  position:absolute;inset:-.4em;
  font-size:1.6em;opacity:.25;
  z-index:0;pointer-events:none;
  animation:auraSpin 4s linear infinite;
}
@keyframes auraSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.avatar-stack .av-outfit{
  position:absolute;bottom:-.1em;left:50%;
  transform:translateX(-50%);
  font-size:.4em;opacity:.85;
}
.avatar-stack .av-pet{
  position:absolute;bottom:-.1em;right:-.5em;
  font-size:.45em;
}
/* Big avatar for designer */
.avatar-big{
  font-size:96px;
  display:flex;align-items:center;justify-content:center;
  margin:14px auto;
}
.avatar-big .avatar-stack{width:1.6em;height:1.6em}
.av-designer{
  display:flex;flex-direction:column;gap:14px;
  width:100%;max-width:480px;margin:0 auto;
}
.av-slot-row{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);
  border-radius:var(--r-md);
  padding:12px;
}
.av-slot-label{
  font-size:11px;text-transform:uppercase;
  letter-spacing:.1em;opacity:.7;
  margin-bottom:8px;font-weight:700;
}
.av-options{
  display:flex;gap:6px;overflow-x:auto;
  padding-bottom:4px;
  scrollbar-width:thin;
}
.av-options::-webkit-scrollbar{height:4px}
.av-options::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:99px}
.av-opt{
  flex-shrink:0;
  width:54px;height:54px;
  background:rgba(255,255,255,.08);
  border:2px solid transparent;
  border-radius:var(--r-md);
  display:grid;place-items:center;
  font-size:28px;cursor:pointer;
  transition:all .15s;
}
.av-opt:active{transform:scale(.92)}
.av-opt.sel{
  border-color:var(--gold);
  background:rgba(245,158,11,.15);
  box-shadow:0 0 16px rgba(245,158,11,.4);
}
.av-opt.empty{font-size:14px;color:rgba(255,255,255,.4)}
.av-opt.add{font-size:22px;background:linear-gradient(135deg,rgba(245,158,11,.2),rgba(245,158,11,.08));border-color:rgba(245,158,11,.4)}
.av-opt.custom{position:relative}
.av-opt.custom::after{content:'✨';position:absolute;top:-2px;right:-2px;font-size:10px}
.avatar-stack.av-size-s{width:1em;height:1em}
.avatar-stack.av-size-l{width:1.8em;height:1.8em}
.av-tools{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  margin:6px 0 12px;
}
.av-tool-btn{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  border-radius:99px;
  padding:7px 14px;
  color:var(--cream);
  font-size:12px;font-weight:700;
  cursor:pointer;
}
.av-tool-btn.active{
  background:rgba(245,158,11,.2);
  border-color:#FBBF24;color:var(--gold-bright);
}
.av-hue-row{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:var(--r-md);padding:10px 14px;
  margin-bottom:8px;
}
.av-hue-slider{
  flex:1;-webkit-appearance:none;appearance:none;
  height:8px;border-radius:99px;
  background:linear-gradient(90deg,#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000);
  outline:none;
}
.av-hue-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:18px;height:18px;border-radius:50%;
  background:white;cursor:pointer;
  border:2px solid var(--ink);
  box-shadow:0 2px 6px rgba(0,0,0,.4);
}
.emoji-picker{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(10,22,51,.98);
  border-top:2px solid var(--gold);
  padding:14px 12px env(safe-area-inset-bottom);
  z-index:200;
  max-height:65vh;overflow-y:auto;
  border-radius:22px 22px 0 0;
  box-shadow:0 -8px 30px rgba(0,0,0,.5);
}
.emoji-picker.open{animation:slideUp .35s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.ep-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;
}
.ep-head h3{
  font-family:'Cinzel',serif;color:var(--gold-bright);font-size:16px;
}
.ep-cats{
  display:flex;gap:6px;overflow-x:auto;
  padding-bottom:6px;margin-bottom:10px;
}
.ep-cat{
  flex-shrink:0;
  padding:6px 12px;border-radius:99px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  font-size:11px;font-weight:700;text-transform:uppercase;
  color:var(--cream);cursor:pointer;
}
.ep-cat.active{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.ep-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));
  gap:4px;
}
.ep-cell{
  aspect-ratio:1;display:grid;place-items:center;
  font-size:28px;cursor:pointer;
  background:rgba(255,255,255,.05);
  border-radius:8px;
  transition:transform .1s;
}
.ep-cell:active{transform:scale(.85);background:rgba(245,158,11,.3)}
.ep-input{
  width:100%;padding:12px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  border-radius:var(--r-md);
  color:var(--cream);font-size:24px;
  text-align:center;font-family:inherit;
  margin-bottom:10px;
}
.loadout-row{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:var(--r-md);
  padding:10px 12px;
  display:flex;align-items:center;gap:10px;
  font-size:13px;
}
.loadout-row .name{flex:1;font-weight:700}
.loadout-row .preview{font-size:32px}
.loadout-row button{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  color:var(--cream);
  padding:6px 12px;border-radius:99px;
  font-size:11px;font-weight:600;
}

/* ==================== v0.7 CRAFT SUPREMACY ==================== */
.av-scene-wrap{
  position:relative;display:inline-flex;
  align-items:center;justify-content:center;
  width:200px;height:200px;
  border-radius:24px;
  overflow:hidden;
  margin:8px auto;
}
.av-scene-bg{
  position:absolute;inset:0;z-index:0;
  border-radius:inherit;
}
.av-frame-wrap{
  position:relative;
  border-radius:24px;
  padding:8px;
  display:inline-block;
  margin:8px auto;
}
.title-chip{
  display:inline-block;
  background:linear-gradient(90deg,var(--gold),var(--gold-bright));
  color:var(--ink);
  font-family:'Cinzel',serif;
  font-weight:800;
  letter-spacing:.08em;
  padding:4px 12px;
  border-radius:99px;
  font-size:11px;
  text-transform:uppercase;
  box-shadow:var(--glow-gold);
  margin:6px auto;
}
.bio-quote{
  font-size:12px;font-style:italic;
  opacity:.85;text-align:center;
  margin:6px 0;padding:0 12px;
  max-width:340px;line-height:1.4;
}
.theme-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
  gap:8px;margin:8px 0;
}
.theme-tile{
  background:rgba(255,255,255,.06);
  border:2px solid rgba(255,255,255,.14);
  border-radius:var(--r-md);
  padding:10px 6px;text-align:center;
  cursor:pointer;
  transition:all .15s;
}
.theme-tile:active{transform:scale(.94)}
.theme-tile.sel{border-color:#FBBF24;background:rgba(245,158,11,.15)}
.theme-tile .em{font-size:24px;display:block;margin-bottom:4px}
.theme-tile .lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.85}

.title-picker{
  max-height:160px;overflow-y:auto;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:var(--r-md);
  padding:8px;
}
.title-pick{
  display:inline-block;margin:3px;
  padding:4px 10px;border-radius:99px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  font-size:10px;font-weight:700;letter-spacing:.05em;
  cursor:pointer;
  text-transform:uppercase;
}
.title-pick.sel{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.title-pick.empty{font-style:italic;opacity:.6}

.bio-input{
  width:100%;padding:10px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  border-radius:var(--r-md);
  color:var(--cream);font-size:13px;
  font-family:inherit;resize:none;
  margin-bottom:8px;
}

@keyframes avBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes avFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes avSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes avPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes avBreathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.95);opacity:.85}}
@keyframes avWobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes avRise{0%,100%{transform:translateY(0);filter:brightness(1)}50%{transform:translateY(-10px);filter:brightness(1.2) drop-shadow(0 0 16px gold)}}

/* ==================== v0.8.1 TRUE 2-COL GRID (NO-OVERLAP) ==================== */
/* Avatar gets its OWN column — content cannot physically overlap */
.av-designer,
#ob-step2{
  display:grid;
  grid-template-columns:1fr 160px;
  gap:14px;
  align-items:start;
}
.av-designer > *:not(.av-sticky-preview),
#ob-step2 > *:not(.av-sticky-preview){ grid-column:1; min-width:0; }
.av-designer > .av-sticky-preview,
#ob-step2 > .av-sticky-preview{
  grid-column:2;
  grid-row:1;
  position:sticky;
  top:12px;
  width:auto;
  background:rgba(10,22,51,.92);
  border:1.5px solid rgba(245,158,11,.4);
  border-radius:18px;
  padding:10px 8px;
  z-index:50;
  text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.4),0 0 24px rgba(245,158,11,.15);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.av-sticky-preview .av-frame-wrap,
.av-sticky-preview .av-scene-wrap{ margin:4px auto 0; }
.av-sticky-preview .av-scene-wrap{ width:130px;height:130px; }
.av-sticky-preview .av-scene-wrap span{ font-size:60px !important; }
.av-sticky-preview .av-tools{ flex-wrap:wrap;gap:4px;margin-top:6px; justify-content:center; }
.av-sticky-preview .av-tool-btn{ padding:4px 8px;font-size:10px; }
.av-sticky-preview .title-chip{ font-size:9px;padding:2px 8px;margin:4px auto; display:inline-block; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.av-sticky-preview .bio-quote{ font-size:10px;margin:4px 0;padding:0 4px; }

function getSeasonalEvent(){
  const d = new Date();
  const m = d.getMonth(), day = d.getDate();
  if(m===11 && day>=20) return {id:'christmas', em:'🎄', name:'Christmas Week', boost:2};
  if(m===2 && day>=20 && m===2 && day<=27) return {id:'easter_run', em:'✝️', name:'Easter Run', boost:2};
  if(m===10 && day===31) return {id:'reformation', em:'📜', name:'Reformation Day', boost:1.5};
  if(m===5 && day>=1 && day<=7) return {id:'pentecost', em:'🔥', name:'Pentecost Week', boost:2};
  if(m===0 && day===1) return {id:'newyear', em:'🎉', name:'New Year', boost:3};
  return null;
}
function renderAvatarStack(av,hueOverride,sizeOverride,opts){
  if(!av) av = State.data?.avatar || DEFAULT_SAVE.avatar;
  const hue = (hueOverride!==undefined?hueOverride:(State.data?.avatarHue||0));
  const size = sizeOverride||State.data?.avatarSize||'M';
  const sat = opts?.saturation ?? (State.data?.saturation??100);
  const bri = opts?.brightness ?? (State.data?.brightness??100);
  const glow = opts?.glow ?? (State.data?.glow??0);
  const animId = opts?.anim ?? (State.data?.anim||'none');
  const sizeClass = size==='S'?'av-size-s':size==='L'?'av-size-l':'';
  const aura = getAvatarEm('aura', av.aura);
  const hat = getAvatarEm('hat', av.hat);
  const face = getAvatarEm('face', av.face);
  const ch = getAvatarEm('character', av.character) || '🧘';
  const outfit = getAvatarEm('outfit', av.outfit);
  const pet = getAvatarEm('pet', av.pet);
  const filterParts = [];
  if(hue) filterParts.push(`hue-rotate(${hue}deg)`);
  if(sat!==100) filterParts.push(`saturate(${sat}%)`);
  if(bri!==100) filterParts.push(`brightness(${bri}%)`);
  if(glow>0) filterParts.push(`drop-shadow(0 0 ${Math.round(glow*.3)}px rgba(255,215,100,.85))`);
  const filter = filterParts.length ? `filter:${filterParts.join(' ')}` : '';
  const animDef = ANIMS.find(a=>a.id===animId);
  const animCss = animDef ? animDef.css : '';
  const styles = [filter, animCss].filter(Boolean).join(';');
  return `<span class="avatar-stack ${sizeClass}" style="${styles}">
    ${aura?`<span class="av-aura">${aura}</span>`:''}
    ${hat?`<span class="av-hat">${hat}</span>`:''}
    <span class="av-main">${ch}${face?`<span class="av-face">${face}</span>`:''}</span>
    ${outfit?`<span class="av-outfit">${outfit}</span>`:''}
    ${pet?`<span class="av-pet">${pet}</span>`:''}
  </span>`;
}

function renderAvatarBig(av, opts){
  // Big wrapper with scene + frame around the stack
  if(!av) av = State.data?.avatar || DEFAULT_SAVE.avatar;
  const sceneId = opts?.scene ?? (State.data?.scene||'none');
  const frameId = opts?.frame ?? (State.data?.frame||'none');
  const sceneDef = SCENES.find(s=>s.id===sceneId) || SCENES[0];
  const frameDef = FRAMES.find(f=>f.id===frameId) || FRAMES[0];
  const stack = renderAvatarStack(av, opts?.hue, opts?.size, opts);
  return `<div class="av-frame-wrap" style="${frameDef.css||''}">
    <div class="av-scene-wrap"><div class="av-scene-bg" style="${sceneDef.css||''}"></div>
    <span style="position:relative;z-index:1;font-size:96px">${stack}</span>
    </div>
  </div>`;
}

function _validateFriendCode(code){
  if(!code) return false;
  code = code.toUpperCase().trim();
  if(!/^[A-HJ-NP-Z2-9]{6}$/.test(code)) return false;
  if(code === State.data.account?.friendCode) return false; // can't add self

const Friends = {
  add(code, name){
    const c = _validateFriendCode(code);
    if(!c) return {ok:false, msg:'invalid friend code'};
    if(!State.data.friends) State.data.friends = [];
    if(State.data.friends.some(f=>f.code===c)) return {ok:false, msg:'already friends'};
    if(State.data.friends.length>=20) return {ok:false, msg:'max 20 friends · remove one first'};
    // assign random vibe so each friend has personality
    const vibe = FRIEND_VIBE_KEYS[Math.floor(Math.random()*FRIEND_VIBE_KEYS.length)];
    State.data.friends.push({
      code:c, name:name||c, vibe,
      addedAt:Date.now(),
      lastSeen:Date.now(),
      messages:[{ts:Date.now(), from:'them', text:`${FRIEND_VIBES[vibe].em} hey saint · we're connected now`}],
    });
    Save.write();
    return {ok:true, code:c};
  },
  remove(code){
    State.data.friends = (State.data.friends||[]).filter(f=>f.code!==code);
    Save.write();
  },
  send(code, text){
    const f = (State.data.friends||[]).find(f=>f.code===code);
    if(!f) return false;
    text = text.trim();
    if(!text) return false;
    f.messages.push({ts:Date.now(), from:'me', text});
    f.lastSeen = Date.now();
    Save.write();
    // Schedule canned reply (1.5–4 sec delay · feels real)
    setTimeout(()=>Friends._reply(code), 1500 + Math.random()*2500);
    return true;
  },
  _reply(code){
    const f = (State.data.friends||[]).find(f=>f.code===code);
    if(!f) return;
    const vibe = FRIEND_VIBES[f.vibe] || FRIEND_VIBES.hype;
    const reply = vibe.replies[Math.floor(Math.random()*vibe.replies.length)];
    f.messages.push({ts:Date.now(), from:'them', text:reply});
    f.lastSeen = Date.now();
    Save.write();
    // If user is in this chat, re-render
    if(State._currentChat===code) App.openChat(code);
    else Toast.show(`${vibe.em} <b>${f.name}</b>: ${reply}`);
  },
  unread(code){
    const f = (State.data.friends||[]).find(f=>f.code===code);
    if(!f) return 0;
    const lastSeen = f.userSawAt||0;
    return f.messages.filter(m=>m.from==='them' && m.ts>lastSeen).length;
  },
  markSeen(code){
    const f = (State.data.friends||[]).find(f=>f.code===code);
    if(f){ f.userSawAt = Date.now(); Save.write(); }
  }
};

// v0.17 ACCOUNT · username · PIN · friend code · soft-lock
const Account = {
  // basic obfuscation (NOT real crypto · just keeps casual eyes off the PIN)
  hash(pin){
    if(!pin) return '';
    const salt = 'brainboard_v1';
    let h = 0;
    const s = salt + pin + salt;
    for(let i=0;i<s.length;i++){ h = ((h<<5)-h) + s.charCodeAt(i); h |= 0; }
    return btoa(String(h)).replace(/=/g,'');
  },
  ensureFriendCode(){
    const a = State.data.account || {};
    if(a.friendCode) return a.friendCode;
    // 6-char alphanumeric, no ambiguous chars
    const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    let code = '';
    for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
    a.friendCode = code;
    if(!a.createdAt) a.createdAt = Date.now();
    State.data.account = a;
    Save.write();
    return code;
  },
  setUsername(u){
    if(!State.data.account) State.data.account = {};
    State.data.account.username = (u||'').slice(0,20);
    Save.write();
  },
  setPin(pin){
    if(!State.data.account) State.data.account = {};
    State.data.account.pinHash = Account.hash(pin);
    // v0.20: setting a PIN does NOT auto-enable lock-on-open · user must opt-in via toggle
    // (prevents bombarding users who just wanted security available, not enforced)
    State.data.account.failedAttempts = 0;
    Save.write();
  },
  removePin(){
    if(!State.data.account) return;
    State.data.account.pinHash = '';
    State.data.account.lockEnabled = false;
    State.data.account.failedAttempts = 0;
    Save.write();
  },
  verify(pin){
    const a = State.data.account||{};
    if(Account.hash(pin)===a.pinHash){
      a.failedAttempts = 0;
      a.lockedUntil = 0;
      Save.write();
      return true;
    }
    a.failedAttempts = (a.failedAttempts||0)+1;
    if(a.failedAttempts>=5){
      a.lockedUntil = Date.now()+60000; // 60s soft-lock
    }
    Save.write();
    return false;
  },
  isLocked(){
    const a = State.data.account||{};
    if(!a.lockEnabled || !a.pinHash) return false;
    return true;
  },
  isHardLocked(){
    const a = State.data.account||{};
    return a.lockedUntil && Date.now()<a.lockedUntil;

function startGameTimer(game, durationSec, onTick, onEnd){
  game._timerStartMs = Date.now();
  game._timerDurationSec = durationSec;
  game.timeLeft = durationSec;
  const fire = ()=>{
    const elapsed = Math.floor((Date.now() - game._timerStartMs)/1000);
    const remaining = Math.max(0, game._timerDurationSec - elapsed);
    game.timeLeft = remaining;
    if(remaining<=0){
      clearInterval(game.timer);
      game.timer = null;
      onEnd && onEnd();
      return;
    }
    onTick && onTick(remaining);
  };
  game.timer = setInterval(fire, 250); // 4× per sec — drift-tolerant
  fire();
  return game.timer;
}
function pauseGameTimer(game){
  if(game.timer){
    clearInterval(game.timer);
    game._pausedAtMs = Date.now();
    game.timer = null;
  }
}
function resumeGameTimer(game, onTick, onEnd){
  if(game._pausedAtMs && game._timerStartMs && game._timerDurationSec){
    // Shift the start forward by the pause duration so timeLeft computation stays accurate
    game._timerStartMs += (Date.now() - game._pausedAtMs);
    game._pausedAtMs = null;
    const fire = ()=>{
      const elapsed = Math.floor((Date.now()-game._timerStartMs)/1000);
      const remaining = Math.max(0, game._timerDurationSec - elapsed);
      game.timeLeft = remaining;
      if(remaining<=0){ clearInterval(game.timer); onEnd&&onEnd(); return; }
      onTick && onTick(remaining);
    };
    game.timer = setInterval(fire, 250);
    fire();
  }
}

// v0.14 DEFAULT CASHOUT · uses common game-state fields if game doesn't expose .cashOut()
function _defaultCashOut(game){
  if(!game) return null;
  // score-based games (Stroop/Math/Anagram/Color/Whack/Trivia/Define/Sequence/Spot/Hunt/Books)
  if(typeof game.score === 'number' && game.score >= 3){
    return {coin: Math.min(180, game.score * 5), brain: game.score>=8?2:1};
  }
  // memory match
  if(game.matched && game.matched.size >= 4){
    return {coin: Math.min(120, game.matched.size * 6), brain: 1};
  }
  // simon (sequence array)
  if(game.sequence && game.sequence.length >= 3){
    return {coin: Math.min(150, game.sequence.length * 8), brain: 1};
  }
  // round-based (reaction/code)
  if(typeof game.round === 'number' && game.round >= 1){
    return {coin: Math.min(140, game.round * 12)};
  }
  // number tap (target tracks progress)
  if(typeof game.target === 'number' && game.target > 5){
    return {coin: Math.min(160, (game.target-1) * 5), brain: 1};
  }
  // wordle (row tracks attempts; cells filled = effort)
  if(Array.isArray(game.cellStates) && game.row > 0){
    const greens = game.cellStates.flat().filter(s=>s==='green').length;
    const yellows = game.cellStates.flat().filter(s=>s==='yellow').length;
    if(greens+yellows >= 3) return {coin: Math.min(80, greens*8 + yellows*3)};
  }
  // lights out (some moves but not cleared)
  if(typeof game.moves === 'number' && game.moves >= 4 && game.grid){
    const lit = game.grid.filter(x=>x).length;
    if(lit < game.grid.length-1) return {coin: 25};
  }
  return null;
}

function getRankTier(rank){
  rank = rank||50;
  return RANK_TIERS.find(t=>rank>=t.min && rank<=t.max) || RANK_TIERS[0];

function rankProgressToNext(rank){
  rank = rank||50;
  const tier = getRankTier(rank);
  const idx = RANK_TIERS.indexOf(tier);
  const next = RANK_TIERS[idx+1];
  if(!next) return {pct:100, next:null, tier};
  const range = next.min - tier.min;
  const into = rank - tier.min;
  return {pct:Math.round((into/range)*100), next, tier};
}

// ===================================================================
// 🧠 v0.22 COACH AI · super-smart per-player adaptive engine
// ===================================================================
// Reads:
//  - per-game win rate · plays · last 8 results (Adaptive)
//  - DNA axes (which categories you're strong/weak in)
//  - time-of-day patterns
//  - current Brain Rank
// Outputs:
//  - per-game win probability prediction (0-1)
//  - threshold adjustments (smart, not punishing)
//  - actionable tip for the player
//  - recommended next game (based on weakest axis)
const Coach = {
  brain(){
    const d = State.data; if(!d) return null;
    const dna = d.brainDNA||{memory:0,speed:0,pattern:0,logic:0,word:0,faith:0};
    const dnaTotal = Object.values(dna).reduce((a,b)=>a+b,0)||1;
    const axisRates = {};
    Object.entries(dna).forEach(([k,v])=>axisRates[k]=v/dnaTotal);
    // Find strongest + weakest axis
    const sorted = Object.entries(dna).sort((a,b)=>b[1]-a[1]);
    const strongest = sorted[0][0];
    const weakest = sorted[sorted.length-1][0];
    // Recent perf
    const recent = (d._recentResults||[]);
    const recentWinRate = recent.length ? recent.reduce((a,b)=>a+b,0)/recent.length : 0.5;
    // Hour of day (perf by hour optional · skip for now)
    return {dna, axisRates, strongest, weakest, recentWinRate, totalPlays:d.totals.games||0};
  },
  predict(roomId, gameId){
    // Returns predicted win probability (0-1) for THIS player on THIS game
    const d = State.data; if(!d) return 0.5;
    const stats = d.perGame[`${roomId}:${gameId}`] || {wins:0, plays:0};
    const personalRate = stats.plays>=3 ? stats.wins/stats.plays : 0.5;
    const recent = Adaptive.multiplier(); // 0.85-1.15
    // Account for category strength
    const axisMap = {word:'word',brain:'memory',mind:'pattern',num:'logic',script:'faith',logic:'logic',speed:'speed',daily:'speed'};
    const axis = axisMap[roomId];
    const brain = Coach.brain();
    let categoryBoost = 0;
    if(axis && brain){
      categoryBoost = brain.axisRates[axis]>0.2 ? 0.1 : (brain.axisRates[axis]<0.05 ? -0.1 : 0);
    }
    let prob = personalRate + categoryBoost - (recent-1)*0.5;
    return Math.max(0.1, Math.min(0.95, prob));
  },
  adjustThreshold(roomId, gameId, base){
    // Smart threshold adjustment: combines Adaptive + personal predict
    const personal = Coach.predict(roomId, gameId);
    const adaptive = Adaptive.multiplier();
    // If predicted >70%: harder (raise threshold ~10%)
    // If predicted <30%: easier (lower threshold ~10%)
    let mult = 1.0;
    if(personal > 0.7) mult = 1.10;
    else if(personal < 0.3) mult = 0.90;
    // Layer Adaptive (small additional nudge)
    mult = mult * (2 - adaptive); // adaptive 0.85→harder lowers it, 1.15→easier raises
    return Math.max(1, Math.round(base * mult));
  },
  tip(){
    const b = Coach.brain();
    if(!b) return 'play a few games so I can learn your style';
    if(b.totalPlays<5) return 'play 5 games · I\'ll start tuning';
    const labels = {memory:'memory',speed:'speed',pattern:'pattern',logic:'logic',word:'word',faith:'faith'};
    const tips = [
      `your ${labels[b.strongest]} brain is strongest 🔥`,
      `your ${labels[b.weakest]} could grow · try a ${labels[b.weakest]} game`,
      b.recentWinRate>0.7 ? 'you\'re hot · I\'m raising the bar' : b.recentWinRate<0.3 ? 'I\'m easing thresholds · keep going' : 'balanced groove',
    ];
    return tips[Math.floor(Math.random()*tips.length)];
  },
  recommendGame(){
    const b = Coach.brain();
    if(!b) return {room:'word', game:'wordle'};
    const axisToRoom = {memory:'brain',speed:'speed',pattern:'mind',logic:'num',word:'word',faith:'script'};
    const targetRoom = axisToRoom[b.weakest] || 'word';
    const games = ROOMS[targetRoom]?.games || [];
    if(!games.length) return {room:'word', game:'wordle'};
    return {room:targetRoom, game:games[Math.floor(Math.random()*games.length)].id};
  }
};

// v0.21 ADAPTIVE GAME DIFFICULTY · rolling 8-game window · gentle auto-tune
// Reads recent perf · returns multiplier 0.85 (winning streak → harder) to 1.15 (losing streak → easier)
const Adaptive = {
  push(won){
    const d = State.data;
    if(!d._recentResults) d._recentResults = [];
    d._recentResults.push(won?1:0);
    if(d._recentResults.length>8) d._recentResults.shift();
    Save.write();
  },
  multiplier(){
    const r = State.data?._recentResults||[];
    if(r.length<3) return 1.0;
    const winRate = r.reduce((a,b)=>a+b,0)/r.length;
    // winRate 0 → 1.15 (easier · 15% more lenient)
    // winRate .5 → 1.0 (no adjustment)
    // winRate 1 → 0.85 (harder · 15% stricter)
    const mult = 1.15 - (winRate * 0.30);
    return Math.max(0.85, Math.min(1.15, mult));
  },
  // For win-threshold games: easier multiplier means LOWER threshold (you need fewer)
  threshold(base){
    return Math.max(1, Math.round(base * (2 - Adaptive.multiplier())));
  },
  // For time-based games: easier means MORE time
  timer(base){
    return Math.round(base * Adaptive.multiplier());
  }
};

const Quests = {
  ensureToday(){

    if(!d.quests) d.quests = {date:'',list:[],claimed:[]};
    const today = new Date().toDateString();
    if(d.quests.date===today) return;
    // Pick 3 random quests for today (deterministic by date)
    const seed = today.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
    const pool = [...QUEST_TEMPLATES];
    const list = [];
    for(let i=0;i<3 && pool.length;i++){
      const idx = (seed + i*7) % pool.length;
      const q = pool.splice(idx,1)[0];
      list.push({...q, progress:0});
    }
    d.quests = {date:today, list, claimed:[]};
    Save.write();
  },
  bump(roomId, won){
    Quests.ensureToday();
    const d = State.data;
    d.quests.list.forEach(q=>{
      if(q.any) q.progress++;
      else if(q.anyWin && won) q.progress++;
      else if(q.room===roomId && won) q.progress++;
    });
    Save.write();
  },
  bumpCombo(combo){
    Quests.ensureToday();
    const d = State.data;
    d.quests.list.forEach(q=>{
      if(q.comboTarget && combo>=q.need) q.progress = q.need;
    });
    Save.write();
  },
  bumpPR(){
    Quests.ensureToday();
    const d = State.data;
    d.quests.list.forEach(q=>{
      if(q.prTarget) q.progress++;

    Save.write();

  claim(qid){
    const d = State.data;

    const k = `${roomId}:${gameId}`;
    const prev = d.prRecords[k] || {};
    let isPR = false;
    if(score!==undefined){
      if(!prev.bestScore || score>prev.bestScore){ prev.bestScore = score; isPR = true; }
    }
    if(time!==undefined){
      if(!prev.bestTime || time<prev.bestTime){ prev.bestTime = time; isPR = true; }
    }
    if(isPR){
      prev.when = Date.now();
      d.prRecords[k] = prev;
      Quests.bumpPR();
      Save.write();
    }
    return isPR;
  }
};

// v0.14 ONLINE FALLBACK · cache results in localStorage
async function isValidWordAsync(w){
  w = w.toUpperCase();
  if(VALID_5.has(w)) return true;
  if(!State.data._wordCache) State.data._wordCache = {};
  const cache = State.data._wordCache;
  if(cache[w]!==undefined) return cache[w];
  try{
    const ctrl = new AbortController();
    setTimeout(()=>ctrl.abort(), 3500);
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${w.toLowerCase()}`, {signal:ctrl.signal});
    cache[w] = res.ok;
    Save.write();
    return res.ok;
  }catch{
    return false;
  }
}

// 💾 SAVE / LOAD
// ====================================================================
const Save = {
  load(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch{return null}
  },
  write(){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(State.data)); }catch{}
  },
  reset(){ localStorage.removeItem(SAVE_KEY); location.reload(); }
};

// 💰 ECONOMY
// ====================================================================
const Wallet = {
  add(c){
    const w = State.data.wallet;
    Object.entries(c).forEach(([k,v])=>{ w[k]=(w[k]||0)+v; });
    Save.write(); UI.updateWallet();
  },
  spend(c){
    const w = State.data.wallet;
    for(const [k,v] of Object.entries(c)) if((w[k]||0)<v) return false;
    Object.entries(c).forEach(([k,v])=>{ w[k]-=v; });
    Save.write(); UI.updateWallet(); return true;
  },
};

    Save.write();

  recent(){ return State.data.activityLog||[]; }
};

// 🧬 BRAIN DNA (v0.3)
// ====================================================================
const DNA = {
  bumpFromRoom(room){
    const d = State.data;
    if(!d.brainDNA) d.brainDNA = {memory:0,speed:0,pattern:0,logic:0,word:0,faith:0};
    const map = {word:'word', brain:'memory', mind:'pattern', num:'logic', script:'faith', logic:'logic', speed:'speed', daily:'speed'};
    const axis = map[room]; if(axis) d.brainDNA[axis]++;
  },
  axes(){
    const d = State.data.brainDNA||{};
    return [
      {k:'memory',label:'Memory',v:d.memory||0},
      {k:'speed',label:'Speed',v:d.speed||0},
      {k:'pattern',label:'Pattern',v:d.pattern||0},
      {k:'logic',label:'Logic',v:d.logic||0},
      {k:'word',label:'Word',v:d.word||0},
      {k:'faith',label:'Faith',v:d.faith||0},
    ];
  },
  renderRadar(size=240){
    const axes = DNA.axes();
    const max = Math.max(5, ...axes.map(a=>a.v));
    const cx=size/2, cy=size/2, r=size/2-30;
    const n=axes.length;
    const angle=i=>(-Math.PI/2)+(i*2*Math.PI/n);
    const point=(i,val)=>({x:cx+Math.cos(angle(i))*r*(val/max), y:cy+Math.sin(angle(i))*r*(val/max)});
    let svg = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">`;
    // grid rings
    for(let g=1;g<=4;g++){
      const ringR = r*(g/4);
      let pts='';
      for(let i=0;i<n;i++){
        const x = cx+Math.cos(angle(i))*ringR;
        const y = cy+Math.sin(angle(i))*ringR;
        pts += `${x},${y} `;
      }
      svg += `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1"/>`;
    }
    // axis lines
    for(let i=0;i<n;i++){
      const e = point(i,max);
      svg += `<line x1="${cx}" y1="${cy}" x2="${e.x}" y2="${e.y}" stroke="rgba(255,255,255,.08)"/>`;
    }
    // data polygon
    let dataPts='';
    axes.forEach((a,i)=>{
      const p = point(i,a.v);
      dataPts += `${p.x},${p.y} `;
    });
    svg += `<polygon points="${dataPts}" fill="rgba(245,158,11,.3)" stroke="#FBBF24" stroke-width="2"/>`;
    // dots
    axes.forEach((a,i)=>{
      const p = point(i,a.v);
      svg += `<circle cx="${p.x}" cy="${p.y}" r="3" fill="#FBBF24"/>`;
    });
    svg += `</svg>`;
    let labels='';
    axes.forEach((a,i)=>{
      const lab = point(i,max*1.18);
      labels += `<div class="dna-label" style="left:${lab.x-22}px;top:${lab.y-8}px;width:44px;text-align:center">${a.label}<br><span style="opacity:.7;font-weight:600">${a.v}</span></div>`;
    });
    return `<div class="dna-radar">${svg}${labels}</div>`;
  }
};

// ====================================================================
// 🎵 v0.30 MUSIC ENGINE · procedural ambient per-screen
// ====================================================================
const Music = (()=>{
  let ctx=null, master=null, schedT=null, currentTrack=null;
  const scales = {
    phrygian:    [0,1,3,5,7,8,10], // dark · holy
    phrygianDom: [0,1,4,5,7,8,10], // exotic · sacred
    mixolydian:  [0,2,4,5,7,9,10], // bright · welcoming
    dorian:      [0,2,3,5,7,9,10], // parchment · medieval
    aeolian:     [0,2,3,5,7,8,10], // melancholy · mysterious
    lydian:      [0,2,4,6,7,9,11], // dreamy · airy
    major:       [0,2,4,5,7,9,11], // bright · precise
  };
  // Each track: bpm · scale · root MIDI · chord progression (degrees) · vibe
  const TRACKS = {
    splash:  {bpm:75, scale:'phrygianDom', root:53, chords:[0,3,5,0], pad:'sine',  arp:'triangle'},
    onboard: {bpm:80, scale:'mixolydian',  root:48, chords:[0,4,5,0], pad:'sine',  arp:'sine'},
    lobby:   {bpm:90, scale:'mixolydian',  root:48, chords:[0,3,4,0], pad:'sine',  arp:'triangle'},
    aux:     {bpm:85, scale:'dorian',      root:50, chords:[0,3,5,0], pad:'sine',  arp:'sine'},
    word:    {bpm:95, scale:'dorian',      root:50, chords:[0,3,4,5], pad:'sine',  arp:'triangle'},
    brain:   {bpm:110,scale:'mixolydian',  root:45, chords:[0,4,5,3], pad:'sawtooth',arp:'sine'},
    mind:    {bpm:80, scale:'aeolian',     root:52, chords:[0,5,3,4], pad:'sine',  arp:'triangle'},
    num:     {bpm:115,scale:'major',       root:43, chords:[0,4,5,0], pad:'sine',  arp:'square'},
    script:  {bpm:70, scale:'phrygianDom', root:50, chords:[0,3,5,0], pad:'sine',  arp:'sine'},
    logic:   {bpm:90, scale:'aeolian',     root:48, chords:[0,3,4,5], pad:'sine',  arp:'triangle'},
    speed:   {bpm:130,scale:'mixolydian',  root:52, chords:[0,4,5,0], pad:'sawtooth',arp:'square'},
    daily:   {bpm:105,scale:'lydian',      root:53, chords:[0,4,5,3], pad:'sine',  arp:'triangle'},
    game:    {bpm:100,scale:'dorian',      root:48, chords:[0,3,4,5], pad:'sine',  arp:'sine'},
  };
  function ac(){
    if(!ctx){
      ctx = new(window.AudioContext||window.webkitAudioContext)();
      master = ctx.createGain();
      // v0.34: louder default · 0.6 instead of 0.35 so it's actually audible
      master.gain.value = State.data?.settings?.musicVolume ?? 0.6;
      master.connect(ctx.destination);
    }
    // v0.32: resume if browser suspended (autoplay block)
    if(ctx.state==='suspended'){ try{ctx.resume();}catch{} }
    return ctx;
  }
  function midiToFreq(m){ return 440 * Math.pow(2,(m-69)/12); }
  function envNote(freq, dur, type='sine', vol=0.05){
    const c=ac(); if(!c) return;
    const o=c.createOscillator(); const g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,c.currentTime);
    g.gain.linearRampToValueAtTime(vol, c.currentTime+0.05);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(c.currentTime+dur+0.05);
  }
  function playChord(track, chordIdx){
    if(!State.data?.settings?.music) return;
    const c=ac(); if(!c || c.state==='suspended') return;
    const sc = scales[track.scale];
    const base = track.root + sc[chordIdx % sc.length];
    const beatSec = 60/track.bpm;
    // v0.34 boosted amplitudes (was 0.04/0.03/0.02 · now 0.08/0.06/0.04)
    envNote(midiToFreq(base),       beatSec*4, track.pad, 0.08);
    envNote(midiToFreq(base+sc[2]), beatSec*4, track.pad, 0.06);
    envNote(midiToFreq(base+sc[4]), beatSec*4, track.pad, 0.04);
    for(let i=0;i<4;i++){
      const noteIdx = [0,2,4,2][i % 4];
      const noteMidi = base + sc[noteIdx];
      // arp boosted 0.025 → 0.045
      setTimeout(()=>envNote(midiToFreq(noteMidi+12), beatSec*0.7, track.arp, 0.045), i*beatSec*1000);
    }
  }
  function loop(track){
    if(!currentTrack) return;
    let chordIdx = 0;
    const beatSec = 60/track.bpm;
    function step(){
      if(!currentTrack || currentTrack!==track) return;
      playChord(track, track.chords[chordIdx % track.chords.length]);
      chordIdx++;
      schedT = setTimeout(step, beatSec*4*1000);
    }
    step();
  }
  return {
    play(trackId){
      if(!State.data?.settings?.music) return;
      const track = TRACKS[trackId];
      if(!track){ Music.stop(); return; }
      if(currentTrack === track) return;
      Music.stop();
      currentTrack = track;
      // Slight delay so screen transitions don't audio-glitch
      setTimeout(()=>{ if(currentTrack===track) loop(track); }, 200);
    },
    stop(){
      currentTrack = null;
      // v0.31 ANTI-FREEZE: forcefully clear ALL pending schedules
      if(schedT){ clearTimeout(schedT); schedT=null; }
      if(master && ctx){
        try{
          master.gain.cancelScheduledValues(ctx.currentTime);
          master.gain.linearRampToValueAtTime(0, ctx.currentTime+0.3);
          setTimeout(()=>{
            if(master) master.gain.value = State.data?.settings?.musicVolume ?? 0.35;
          }, 400);
        }catch{}
      }
    },
    setVolume(v){
      if(master) master.gain.value = v;
    },
    toggle(){
      State.data.settings.music = !State.data.settings.music;
      Save.write();
      if(!State.data.settings.music) Music.stop();
    },
  };
})();

// v0.30 TTS · speak game prompts when toggle on
function speak(text){
  if(!State.data?.settings?.tts) return;
  if(!window.speechSynthesis) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95; u.pitch = 1.0; u.volume = 0.85;
    window.speechSynthesis.speak(u);
  }catch{}
}

// v0.30 KID-SAFE content filter · removes adult-context entries from trivia/TF/define
const KID_UNSAFE_KEYWORDS = ['murder','kill','adultery','death','died','drown','sword','wife','blood','hell','curse','devil'];
function isKidSafe(text){
  if(!text) return true;
  const lower = text.toLowerCase();
  return !KID_UNSAFE_KEYWORDS.some(k=>lower.includes(k));
}
function filterKidSafe(arr, getText){
  if(!State.data?.settings?.kidSafe) return arr;
  return arr.filter(item => isKidSafe(getText(item)));
}

// 🔊 SFX (procedural via WebAudio)
// ====================================================================
const SFX = (()=>{
  let ctx=null;
  function ac(){ if(!ctx&&State.data?.settings?.sfx) ctx=new(window.AudioContext||window.webkitAudioContext)(); return ctx; }
  function tone(freq,dur=.15,type='sine',gain=.15){
    const c = ac(); if(!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(gain,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
  }
  return {
    tap(){ tone(660,.06,'square',.08); },
    correct(){ tone(523,.1); setTimeout(()=>tone(784,.15),60); },
    wrong(){ tone(220,.18,'sawtooth',.1); },
    win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18),i*100)); },
    chime(){ [349,440,523].forEach((f,i)=>setTimeout(()=>tone(f,.25,'sine',.12),i*120)); },
    holy(){ [392,493,587,784,987].forEach((f,i)=>setTimeout(()=>tone(f,.4,'sine',.1),i*120)); },
  };
})();

function confetti(){
  const colors=['#F59E0B','#FBBF24','#7C3AED','#3B82F6','#10B981','#EF4444','#FFF8E7'];
  for(let i=0;i<36;i++){

    p.style.left=(50+Math.random()*10-5)+'%';
    p.style.top='40%';
    p.style.setProperty('--dx', ((Math.random()-.5)*window.innerWidth*1.2)+'px');
    p.style.setProperty('--dy', ((Math.random()-.2)*window.innerHeight*.9)+'px');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1600);
  }
}

const App = {
  init(){
    try{
      const saved = Save.load();
      if(saved && saved.v){ State.data = {...DEFAULT_SAVE, ...saved}; }
      else{ State.data = JSON.parse(JSON.stringify(DEFAULT_SAVE)); }
      UI.updateWallet();
      Account.ensureFriendCode();
      // v0.20 apply persistent accessibility settings
      document.body.classList.toggle('large-text', !!State.data.settings?.largeText);
      document.body.classList.toggle('color-blind', !!State.data.settings?.colorBlindSafe);
      // v0.22 ONE-TIME MIGRATION: rescale rank from 1000-baseline to 50-baseline
      _migrateRankIfNeeded();
      // v0.24 apply persisted theme
      applyAppTheme(State.data.appTheme||'cobalt');
      // v0.29 ensure current month's BP is active
      ensureMonthlyPass();
      // v0.26 cinematic intro is now triggered AFTER user taps splash CTA (see tapEnter)
      // not on init, to avoid covering the splash button
      // v0.26 SUNDAY WEEKLY REPORT (auto-show once per week if onboarded)
      if(State.data.onboarded){
        const now = new Date();
        const sunday = (now.getDay()===0); // Sunday
        const lastShown = State.data.weeklyReportLastShown ? new Date(State.data.weeklyReportLastShown) : null;
        const lastShownThisWeek = lastShown && (Math.abs(now-lastShown) < 7*86400000);
        if(sunday && !lastShownThisWeek && State.data.totals.games>=5){
          setTimeout(()=>App.showWeeklyReport(), 1500);
        }
      }
      // v0.21 ONE-TIME MIGRATION: prior versions auto-enabled lock-on-open
      // if user hasn't explicitly opt'd in via the new flow, disable it
      if(State.data.account && State.data.account.lockEnabled && !State.data.account.explicitlyEnabledLock){
        State.data.account.lockEnabled = false;
        Save.write();
        // toast a one-time notice so user knows
        setTimeout(()=>Toast.show('🔓 lock-on-open disabled · re-enable in Settings if wanted'), 1200);
      }
      // Lock check — only when explicitly opt'd-in
      if(Account.isLocked()){
        App.showLockScreen();
        return;
      }
      // v0.11: ALWAYS show splash on open · TAP TO ENTER decides next route
      App.renderSplashPersonal();
      UI.show('splash');
    }catch(e){
      console.error('BrainBoard init error:',e);
      _showFatal(e);
    }
  },
  showLockScreen(){
    Modal.show(`
      <div class="big">🔒</div>
      <h3>enter PIN</h3>
      <p class="dim" style="font-size:12px;margin:6px 0">your account is protected</p>
      <input id="lock-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" style="width:160px;text-align:center;font-size:32px;letter-spacing:.6em;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:14px;color:var(--cream);font-family:'Cinzel',serif;margin:14px auto;display:block">
      <div class="modal-actions" style="flex-direction:column;gap:8px">
        <button class="btn-primary" onclick="App.verifyLock()">▶ unlock</button>
        <button class="btn-secondary" onclick="if(confirm('reset all progress?'))Save.reset()" style="background:rgba(239,68,68,.15)">forgot PIN · reset all</button>
      </div>`);
    setTimeout(()=>document.getElementById('lock-pin')?.focus(),100);
    document.getElementById('lock-pin').onkeydown=(e)=>{ if(e.key==='Enter') App.verifyLock(); };
  },
  verifyLock(){
    const inp = document.getElementById('lock-pin');
    if(!inp) return;
    const pin = inp.value;
    if(Account.isHardLocked()){
      const remaining = Math.ceil((State.data.account.lockedUntil-Date.now())/1000);
      Toast.show(`🔒 too many tries · wait ${remaining}s`);
      SFX.wrong(); haptic(40);
      return;
    }
    if(Account.verify(pin)){
      Modal.close();
      SFX.holy(); haptic(20);
      App.renderSplashPersonal();
      UI.show('splash');
    }else{
      const a = State.data.account;
      const left = 5-(a.failedAttempts||0);
      Toast.show(`🚫 wrong · ${left} tries left`);
      SFX.wrong(); haptic(40);
      inp.value = '';
    }

  // ----- DAILY -----
  checkDaily(){
    const d = State.data, today = new Date().toDateString();
    const last = d.lastDailyClaim ? new Date(d.lastDailyClaim).toDateString() : null;
    if(today!==last){
      // streak logic
      const yest = new Date(Date.now()-86400000).toDateString();
      const wouldBreak = last !== yest && d.streak >= 1;
      // v0.25 STREAK SAVE: if streak would break + user has streakSave, offer to use it
      if(wouldBreak && (d.powerups?.streakSave||0)>0){
        Modal.show(`<div class="big">🛡️</div>
          <h3>save your streak?</h3>
          <p style="margin:8px 0;font-size:13px">your ${d.streak}-day streak is about to break · use a Streak Save?</p>
          <p class="dim" style="font-size:11px">you have ${d.powerups.streakSave} streak save${d.powerups.streakSave>1?'s':''}</p>
          <div class="modal-actions" style="flex-direction:column;gap:8px;margin-top:12px">
            <button class="btn-primary" onclick="App._useStreakSave()">🛡️ USE · keep streak</button>
            <button class="btn-secondary" onclick="App._loseStreak()">❌ let it go</button>
          </div>`);
        return;
      }
      d.streak = (last===yest) ? (d.streak+1) : 1;
      d.lastDailyClaim = Date.now();
      const reward = {coin:100, gem:1, faith:1};
      if(d.streak>=7) reward.gem += 1;
      if(d.streak>=30) reward.gem += 3;
      // v0.32 7-day streak gem rewards
      if(d.streak%7===0 && d.streak>0){
        reward.gem = (reward.gem||0)+2;
        Ach.unlock('streak_gem');
      }
      Wallet.add(reward);
      Save.write();
      const v = randomVerse();
      Modal.show(`
        <div class="big">🎁</div>
        <h3>Daily Blessing</h3>
        <p class="dim">streak: 🔥 ${d.streak} day${d.streak>1?'s':''}</p>
        <div class="reward-row">
          ${Object.entries(reward).map(([k,n])=>{const e={coin:'🪙',gem:'💎',faith:'✝️'}[k]; return `<span class="reward-chip">+${n} ${e}</span>`}).join('')}
        </div>
        <div class="verse">"${v.t}"<cite>— ${v.r}</cite></div>
        <div class="modal-actions"><button class="btn-primary" onclick="Modal.close()">🙌 amen</button></div>
      `);
      SFX.holy();
      haptic(40);
      Ach.check();
    }
  },

  exitGame(){

    const game = State.gameInst;
    const cash = (typeof game.cashOut === 'function') ? game.cashOut() : _defaultCashOut(game);
    // If no progress at all, just quit immediately
    if(!cash || !cash.coin){
      App._doExit(false);
      return;
    }
    // v0.31 RESUME · save game snapshot if game supports it
    const snapshot = (typeof game.snapshot === 'function') ? game.snapshot() : null;
    if(snapshot){
      State.data._savedGames = State.data._savedGames || {};
      State.data._savedGames[snapshot.gameKey] = {ts:Date.now(), snap:snapshot};
      Save.write();
    }
    // Pause any timers while dialog is up
    if(game.timer){ clearInterval(game.timer); game._wasTimer = true; }
    if(game.spawnTimer){ clearInterval(game.spawnTimer); game._wasSpawn = true; }
    if(game.tickInt){ clearInterval(game.tickInt); game._wasTick = true; }
    Modal.show(`
      <div class="big">⏸️</div>
      <h3>quit this game?</h3>
      <p class="dim" style="margin:8px 0;font-size:13px">you have progress · keep going or cash out partial rewards</p>

        ${Object.entries(cash).map(([k,v])=>{const e={coin:'🪙',gem:'💎',brain:'🧠',faith:'✝️'}[k]||'';return v?`<span class="reward-chip">+${v} ${e}</span>`:''}).join('')}
      </div>
      <div class="modal-actions" style="flex-direction:column;gap:8px;margin-top:14px">
        <button class="btn-primary" onclick="App._exitChoice('resume')">▶ keep playing</button>
        ${snapshot?'<button class="btn-secondary" onclick="App._exitChoice(\'save\')" style="background:rgba(34,211,238,.18);border-color:rgba(34,211,238,.4)">📥 save & quit · resume later</button>':''}
        <button class="btn-secondary" onclick="App._exitChoice('cashout')">💰 cash out · take rewards</button>
        <button class="btn-secondary" style="background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4)" onclick="App._exitChoice('quit')">❌ quit · no rewards</button>
      </div>`);

  _exitChoice(choice){
    Modal.close();
    const pe = State._pendingExit; if(!pe) return;
    State._pendingExit = null;
    if(choice==='resume'){
      // Resume any paused timers
      const g = pe.game;
      if(g._wasTimer && g.timer===null||g._wasTimer){
        // Re-create timer based on game type — simplest: trigger a render cycle
        if(typeof g.render === 'function') g.render();
        // For timed games, restart the interval if they had one
        if(g.timeLeft!==undefined && g._wasTimer){
          g.timer = setInterval(()=>{
            g.timeLeft--;
            if(g.timeLeft<=0){ g.end&&g.end(); return; }
            g.render();
          }, 1000);
        }
      }
      if(g._wasSpawn && typeof g.spawn==='function'){
        g.spawnTimer = setInterval(()=>g.spawn(), 800);
      }
      if(g._wasTick && typeof g.render==='function'){
        g.tickInt = setInterval(()=>g.render(), 100);
      }
      delete g._wasTimer; delete g._wasSpawn; delete g._wasTick;
      return;
    }
    if(choice==='cashout' && pe.cash){
      if(pe.game.cleanup) pe.game.cleanup();
      const c = _antiCheatClamp(pe.cash);
      Wallet.add(c);
      State.data._cashoutCount = (State.data._cashoutCount||0)+1;
      Save.write();
      Ach.unlock('cashout_first');
      if((State.data._cashoutCount||0)>=5) Ach.unlock('cashout_5');
      Activity.log('win','💰',`cashed out: +${c.coin||0} 🪙`);
      Toast.show(`💰 cashed out · +${c.coin||0} 🪙`);
      SFX.correct(); haptic(20);
    }
    if(choice==='save'){
      if(pe.game.cleanup) pe.game.cleanup();
      Toast.show('📥 saved · resume from game card');
      Ach.unlock('saved_resume');
    }
    if(choice==='quit'){
      if(pe.game.cleanup) pe.game.cleanup();
      // Clear any saved snapshot
      if(pe.snapshot && State.data._savedGames){
        delete State.data._savedGames[pe.snapshot.gameKey];
        Save.write();
      }
    }
    State.gameInst = null;
    if(State.currentRoom) App.openRoom(State.currentRoom);
    else App.toLobby();
  },

    if(State.gameInst?.cleanup) State.gameInst.cleanup();

      return 0;
    });

      const u = !!d.ach[a.id];
      // Estimate progress for locked ones (best-effort by parsing description)
      let progressBar = '';
      if(!u){
        const prog = App._achProgress(a, d);
        if(prog && prog.need>0){
          const pct = Math.min(100, Math.round((prog.have/prog.need)*100));
          progressBar = `<div style="background:rgba(255,255,255,.06);border-radius:99px;height:4px;margin-top:4px;overflow:hidden"><div style="background:var(--gold);height:100%;width:${pct}%"></div></div><div class="dim" style="font-size:10px;margin-top:2px">${prog.have}/${prog.need}</div>`;

  _achProgress(a, d){
    const p = d.perGame||{};
    const sum = (cat)=>Object.entries(p).filter(([k])=>k.startsWith(cat+':')).reduce((acc,[,v])=>acc+(v.wins||0),0);
    switch(a.id){
      case 'first_win': return {have:d.totals.wins, need:1};
      case 'word_5': return {have:sum('word'), need:5};
      case 'brain_5': return {have:sum('brain'), need:5};
      case 'mind_5': return {have:sum('mind'), need:5};
      case 'num_5': return {have:sum('num'), need:5};
      case 'script_5': return {have:sum('script'), need:5};
      case 'word_25': return {have:sum('word'), need:25};
      case 'brain_25': return {have:sum('brain'), need:25};
      case 'mind_25': return {have:sum('mind'), need:25};
      case 'num_25': return {have:sum('num'), need:25};
      case 'script_25': return {have:sum('script'), need:25};
      case 'logic_5': return {have:sum('logic'), need:5};
      case 'logic_25': return {have:sum('logic'), need:25};
      case 'speed_5': return {have:sum('speed'), need:5};
      case 'speed_25': return {have:sum('speed'), need:25};
      case 'streak_3': return {have:d.streak, need:3};
      case 'streak_7': return {have:d.streak, need:7};
      case 'streak_30': return {have:d.streak, need:30};
      case 'wins_50': return {have:d.totals.wins, need:50};
      case 'wins_100': return {have:d.totals.wins, need:100};
      case 'iq_1200': return {have:d.iq, need:1200};
      case 'iq_1500': return {have:d.iq, need:1500};
      case 'iq_2000': return {have:d.iq, need:2000};
      case 'fashion_3': return {have:(d.loadouts||[]).length, need:3};
      case 'avatar_chaos': return {have:(d._randomizeCount||0), need:5};
      case 'fair_play': return {have:d.totals.wins, need:10};
    }
    return null;
  },
